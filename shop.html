<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #6c63ff;
      --accent-dark: #574fd6;
      --bg: #f5f6fa;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --sidebar-w: 380px;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,.08);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
      height: 64px;
      background: #fff;
      box-shadow: 0 1px 8px rgba(0,0,0,.07);
    }
    .logo { font-size: 1.35rem; font-weight: 700; color: var(--accent); letter-spacing: -.5px; }
    .cart-btn {
      position: relative;
      background: var(--accent);
      color: #fff;
      border: none; cursor: pointer;
      border-radius: 50px;
      padding: .55rem 1.3rem;
      font-size: .95rem; font-weight: 600;
      display: flex; align-items: center; gap: .5rem;
      transition: background .2s, transform .15s;
    }
    .cart-btn:hover { background: var(--accent-dark); transform: scale(1.03); }
    .cart-badge {
      background: #ff4d6d; color: #fff;
      font-size: .7rem; font-weight: 700;
      border-radius: 50%; width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      position: absolute; top: -6px; right: -6px;
      transition: transform .2s;
    }
    .cart-badge.bump { animation: bump .25s ease; }
    @keyframes bump { 0%,100%{transform:scale(1)} 50%{transform:scale(1.45)} }

    /* ── PRODUCT GRID ────────────────────────────────────── */
    main { max-width: 1100px; margin: 2.5rem auto; padding: 0 1.5rem; }
    h1 { font-size: 1.9rem; font-weight: 700; margin-bottom: 1.8rem; }
    h1 span { color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 32px rgba(0,0,0,.12); }

    .card-img {
      width: 100%; height: 190px; object-fit: cover;
      background: linear-gradient(135deg, #e0e0ff 0%, #d4f0ff 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem;
    }

    .card-body { padding: 1.2rem; flex: 1; display: flex; flex-direction: column; gap: .5rem; }
    .card-name { font-size: 1.05rem; font-weight: 700; }
    .card-desc { font-size: .84rem; color: var(--muted); flex: 1; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: .8rem; }
    .card-price { font-size: 1.2rem; font-weight: 800; color: var(--accent); }

    .add-btn {
      background: var(--accent);
      color: #fff; border: none; cursor: pointer;
      border-radius: 8px; padding: .5rem 1rem;
      font-size: .88rem; font-weight: 600;
      transition: background .2s, transform .15s;
    }
    .add-btn:hover { background: var(--accent-dark); transform: scale(1.05); }
    .add-btn:active { transform: scale(.97); }

    /* ── OVERLAY ─────────────────────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
      z-index: 200;
    }
    #overlay.show { opacity: 1; pointer-events: auto; }

    /* ── CART SIDEBAR ────────────────────────────────────── */
    #cart-sidebar {
      position: fixed; top: 0; right: 0;
      width: var(--sidebar-w); height: 100%;
      background: #fff;
      box-shadow: -6px 0 32px rgba(0,0,0,.12);
      transform: translateX(100%);
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      z-index: 300;
      display: flex; flex-direction: column;
    }
    #cart-sidebar.open { transform: translateX(0); }

    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.3rem 1.5rem;
      border-bottom: 1px solid #f0f0f0;
    }
    .sidebar-header h2 { font-size: 1.2rem; font-weight: 700; }
    .close-btn {
      background: none; border: none; cursor: pointer;
      font-size: 1.5rem; color: var(--muted);
      line-height: 1; padding: .2rem .4rem; border-radius: 6px;
      transition: background .15s, color .15s;
    }
    .close-btn:hover { background: #f5f5f5; color: var(--text); }

    .cart-items { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }

    .empty-cart {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 1rem; color: var(--muted);
    }
    .empty-cart .icon { font-size: 3.5rem; }
    .empty-cart p { font-size: .95rem; }

    .cart-item {
      display: flex; align-items: center; gap: 1rem;
      padding: .9rem 0;
      border-bottom: 1px solid #f5f5f5;
      animation: slideIn .2s ease;
    }
    @keyframes slideIn { from{opacity:0;transform:translateX(16px)} to{opacity:1;transform:none} }

    .item-icon { font-size: 2rem; width: 44px; text-align: center; }
    .item-info { flex: 1; }
    .item-name { font-size: .93rem; font-weight: 600; }
    .item-unit { font-size: .8rem; color: var(--muted); }

    .qty-ctrl {
      display: flex; align-items: center; gap: .4rem;
    }
    .qty-btn {
      width: 28px; height: 28px;
      border-radius: 50%; border: 2px solid var(--accent);
      background: none; color: var(--accent);
      font-size: 1rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .qty-btn:hover { background: var(--accent); color: #fff; }
    .qty-num { font-size: .95rem; font-weight: 700; min-width: 20px; text-align: center; }

    .item-subtotal { font-size: .9rem; font-weight: 700; min-width: 52px; text-align: right; }

    .sidebar-footer {
      padding: 1.2rem 1.5rem;
      border-top: 1px solid #f0f0f0;
    }
    .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .total-label { font-size: 1rem; color: var(--muted); }
    .total-amount { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

    .checkout-btn {
      width: 100%; padding: .85rem;
      background: var(--accent); color: #fff;
      border: none; border-radius: 10px; cursor: pointer;
      font-size: 1rem; font-weight: 700;
      transition: background .2s, transform .15s;
    }
    .checkout-btn:hover { background: var(--accent-dark); transform: scale(1.01); }
    .checkout-btn:disabled { background: #c5c5d6; cursor: default; transform: none; }

    .clear-btn {
      width: 100%; margin-top: .6rem; padding: .6rem;
      background: none; color: var(--muted);
      border: 1px solid #e5e5e5; border-radius: 10px; cursor: pointer;
      font-size: .88rem; transition: background .15s;
    }
    .clear-btn:hover { background: #f5f5f5; }

    @media (max-width: 480px) {
      :root { --sidebar-w: 100vw; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">🛍️ ShopVibe</div>
  <button class="cart-btn" id="cart-toggle-btn" aria-label="Open cart">
    🛒 Cart
    <span class="cart-badge" id="cart-badge">0</span>
  </button>
</header>

<!-- MAIN -->
<main>
  <h1>Featured <span>Products</span></h1>
  <div class="grid" id="product-grid"></div>
</main>

<!-- OVERLAY -->
<div id="overlay"></div>

<!-- CART SIDEBAR -->
<aside id="cart-sidebar" aria-label="Shopping cart">
  <div class="sidebar-header">
    <h2>🛒 Your Cart</h2>
    <button class="close-btn" id="close-cart" aria-label="Close cart">✕</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="sidebar-footer">
    <div class="total-row">
      <span class="total-label">Total</span>
      <span class="total-amount" id="cart-total">$0.00</span>
    </div>
    <button class="checkout-btn" id="checkout-btn" disabled>Checkout</button>
    <button class="clear-btn" id="clear-cart-btn">Clear cart</button>
  </div>
</aside>

<script>
  const API_BASE = 'http://localhost:4000';

  // ── State ──────────────────────────────────────────────
  const cart = {};   // { id: { product, qty } }

  // ── DOM refs ───────────────────────────────────────────
  const grid        = document.getElementById('product-grid');
  const sidebar     = document.getElementById('cart-sidebar');
  const overlay     = document.getElementById('overlay');
  const cartItems   = document.getElementById('cart-items');
  const cartTotal   = document.getElementById('cart-total');
  const cartBadge   = document.getElementById('cart-badge');
  const checkoutBtn = document.getElementById('checkout-btn');

  // ── Sidebar open/close ─────────────────────────────────
  function openCart()  { sidebar.classList.add('open');  overlay.classList.add('show'); }
  function closeCart() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }

  document.getElementById('cart-toggle-btn').addEventListener('click', openCart);
  document.getElementById('close-cart').addEventListener('click', closeCart);
  overlay.addEventListener('click', closeCart);

  // ── Fetch products from API ────────────────────────────
  async function loadProducts() {
    try {
      const res = await fetch(`${API_BASE}/api/products`);
      const products = await res.json();
      renderProducts(products);
    } catch (err) {
      grid.innerHTML = '<p style="color:#e53e3e;padding:1rem">⚠️ Could not load products. Make sure the API server is running on port 4000.</p>';
    }
  }

  function renderProducts(products) {
    grid.innerHTML = '';
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-img">${p.emoji}</div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.description}</div>
          <div class="card-footer">
            <span class="card-price">$${p.price.toFixed(2)}</span>
            <button class="add-btn" data-id="${p.id}">Add to Cart</button>
          </div>
        </div>`;
      card.querySelector('.add-btn').addEventListener('click', () => addToCart(p));
      grid.appendChild(card);
    });
  }

  // ── Cart logic ─────────────────────────────────────────
  function addToCart(product) {
    if (cart[product.id]) {
      cart[product.id].qty++;
    } else {
      cart[product.id] = { product, qty: 1 };
    }
    renderCart();
    openCart();
    bumpBadge();
  }

  function changeQty(id, delta) {
    if (!cart[id]) return;
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    renderCart();
  }

  function renderCart() {
    const entries = Object.values(cart);

    if (entries.length === 0) {
      cartItems.innerHTML = `
        <div class="empty-cart">
          <div class="icon">🛒</div>
          <p>Your cart is empty</p>
        </div>`;
      cartTotal.textContent = '$0.00';
      cartBadge.textContent = '0';
      checkoutBtn.disabled = true;
      return;
    }

    let total = 0;
    let totalQty = 0;
    cartItems.innerHTML = '';

    entries.forEach(({ product: p, qty }) => {
      total += p.price * qty;
      totalQty += qty;

      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <div class="item-icon">${p.emoji}</div>
        <div class="item-info">
          <div class="item-name">${p.name}</div>
          <div class="item-unit">$${p.price.toFixed(2)} each</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" data-id="${p.id}" data-delta="-1">−</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn" data-id="${p.id}" data-delta="1">+</button>
        </div>
        <div class="item-subtotal">$${(p.price * qty).toFixed(2)}</div>`;
      cartItems.appendChild(row);
    });

    cartTotal.textContent = `$${total.toFixed(2)}`;
    cartBadge.textContent = totalQty;
    checkoutBtn.disabled = false;
  }

  // delegated qty click
  cartItems.addEventListener('click', e => {
    const btn = e.target.closest('.qty-btn');
    if (!btn) return;
    changeQty(btn.dataset.id, parseInt(btn.dataset.delta, 10));
  });

  document.getElementById('clear-cart-btn').addEventListener('click', () => {
    Object.keys(cart).forEach(k => delete cart[k]);
    renderCart();
  });

  document.getElementById('checkout-btn').addEventListener('click', () => {
    alert('✅ Order placed! Thank you for shopping with ShopVibe.');
    Object.keys(cart).forEach(k => delete cart[k]);
    renderCart();
    closeCart();
  });

  function bumpBadge() {
    cartBadge.classList.remove('bump');
    void cartBadge.offsetWidth;
    cartBadge.classList.add('bump');
  }

  // ── Init ───────────────────────────────────────────────
  loadProducts();
</script>
</body>
</html>
