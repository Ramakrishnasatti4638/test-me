<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link not found · SnapURL</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .notfound { text-align: center; padding: 60px 20px; }
    .notfound h1 { font-size: 28px; margin: 0 0 8px; }
    .notfound p { color: var(--muted); margin: 0 0 24px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">
      <span class="brand-logo">⚡</span>
      <span class="brand-name">SnapURL</span>
    </a>
    <nav>
      <a href="/">Home</a>
    </nav>
  </header>
  <main>
    <div class="card notfound">
      <h1>Link not found</h1>
      <p>The short link you tried doesn't exist (or has been deleted).</p>
      <a class="btn primary" href="/">Go home</a>
    </div>
  </main>
</body>
</html>
