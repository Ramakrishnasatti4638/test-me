<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Link Not Found</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell" style="text-align: center; margin-top: 80px;">
    <div class="card" style="max-width: 500px; margin: 0 auto; padding: 40px 24px;">
      <h1 style="font-size: 48px; margin-bottom: 12px;">🔍 404</h1>
      <h2 style="font-size: 20px; margin-bottom: 16px;">Short Link Not Found</h2>
      <p style="color: var(--text-muted); margin-bottom: 24px;">
        The requested link does not exist, has expired, or was removed.
      </p>
      <a href="/" class="primary-btn" style="text-decoration: none;">Return to Home</a>
    </div>
  </div>
</body>
</html>
