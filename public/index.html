<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #e2e8f0;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 2rem;
      text-align: center;
      margin-bottom: 0.25rem;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      text-align: center;
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="url"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #f1f5f9;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]::placeholder { color: #64748b; }

    input[type="url"]:focus {
      border-color: #a78bfa;
    }

    button.shorten-btn {
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
    }

    button.shorten-btn:hover { opacity: 0.88; }
    button.shorten-btn:active { transform: scale(0.97); }
    button.shorten-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      margin-top: 0.6rem;
      font-size: 0.82rem;
      color: #f87171;
      min-height: 1rem;
    }

    .result-box {
      margin-top: 1.5rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0.9rem;
      padding: 1.1rem 1.2rem;
      display: none;
    }

    .result-box.visible { display: block; }

    .result-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }

    .result-link-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .result-link {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
      color: #818cf8;
      text-decoration: none;
      word-break: break-all;
    }

    .result-link:hover { text-decoration: underline; }

    .copy-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: #e2e8f0;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .copy-btn:hover { background: rgba(255,255,255,0.15); }
    .copy-btn.copied { color: #34d399; border-color: #34d399; }

    .history {
      margin-top: 2rem;
    }

    .history-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 0.75rem;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 220px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255,255,255,0.05);
      border-radius: 0.6rem;
      padding: 0.55rem 0.9rem;
      font-size: 0.85rem;
    }

    .history-short {
      font-weight: 600;
      color: #818cf8;
      text-decoration: none;
      min-width: 80px;
    }

    .history-short:hover { text-decoration: underline; }

    .history-arrow { color: #475569; }

    .history-original {
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔗</div>
    <h1>URL Shortener</h1>
    <p class="subtitle">Paste a long URL and get a short, shareable link instantly.</p>

    <form id="shortenForm">
      <div class="input-row">
        <input
          type="url"
          id="urlInput"
          placeholder="https://example.com/very/long/url..."
          required
          autocomplete="off"
        />
        <button type="submit" class="shorten-btn" id="submitBtn">Shorten</button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="result-box" id="resultBox">
      <div class="result-label">Your short link</div>
      <div class="result-link-row">
        <a href="#" id="resultLink" class="result-link"></a>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
    </div>

    <div class="history" id="historySection" style="display:none">
      <div class="history-title">Recent links</div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <script>
    const form = document.getElementById('shortenForm');
    const urlInput = document.getElementById('urlInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const resultBox = document.getElementById('resultBox');
    const resultLink = document.getElementById('resultLink');
    const copyBtn = document.getElementById('copyBtn');
    const historySection = document.getElementById('historySection');
    const historyList = document.getElementById('historyList');

    const history = [];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Shortening…';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: urlInput.value.trim() }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Something went wrong.';
          return;
        }

        const fullShort = `${location.origin}${data.shortUrl}`;
        resultLink.href = fullShort;
        resultLink.textContent = fullShort;
        resultBox.classList.add('visible');

        addToHistory(data.shortUrl, urlInput.value.trim());
        urlInput.value = '';
      } catch {
        errorMsg.textContent = 'Network error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Shorten';
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(resultLink.href).then(() => {
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 2000);
      });
    });

    function addToHistory(shortPath, originalUrl) {
      history.unshift({ shortPath, originalUrl });
      if (history.length > 10) history.pop();
      renderHistory();
    }

    function renderHistory() {
      historySection.style.display = 'block';
      historyList.innerHTML = history
        .map(({ shortPath, originalUrl }) => {
          const short = `${location.origin}${shortPath}`;
          return `
            <li class="history-item">
              <a class="history-short" href="${short}">${shortPath}</a>
              <span class="history-arrow">→</span>
              <span class="history-original" title="${originalUrl}">${originalUrl}</span>
            </li>`;
        })
        .join('');
    }
  </script>
</body>
</html>
