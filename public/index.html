<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      text-align: center;
      font-size: 2em;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 0.95em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 0.95em;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-shorten {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-shorten:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-shorten:active {
      transform: translateY(0);
    }

    .btn-clear {
      background: #f0f0f0;
      color: #333;
    }

    .btn-clear:hover {
      background: #e0e0e0;
    }

    .result-section {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #f0f0f0;
    }

    .result-box {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .result-label {
      color: #666;
      font-size: 0.85em;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .result-value {
      color: #333;
      font-size: 1em;
      word-break: break-all;
      font-family: 'Courier New', monospace;
    }

    .copy-btn {
      padding: 6px 12px;
      margin-top: 8px;
      font-size: 0.85em;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .copy-btn:hover {
      background: #764ba2;
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .urls-list {
      margin-top: 30px;
      max-height: 300px;
      overflow-y: auto;
    }

    .urls-list h3 {
      color: #333;
      margin-bottom: 15px;
      font-size: 1.1em;
    }

    .url-item {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 0.9em;
    }

    .url-item-short {
      color: #667eea;
      font-weight: 600;
      font-family: 'Courier New', monospace;
      margin-bottom: 5px;
    }

    .url-item-short a {
      color: #667eea;
      text-decoration: none;
      cursor: pointer;
    }

    .url-item-short a:hover {
      text-decoration: underline;
    }

    .url-item-original {
      color: #666;
      word-break: break-all;
      font-size: 0.85em;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 1.5em;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Create short, shareable links instantly</p>

    <div class="success-message" id="successMessage"></div>
    <div class="error-message" id="errorMessage"></div>

    <form id="shortenForm">
      <div class="form-group">
        <label for="urlInput">Enter your URL</label>
        <input
          type="text"
          id="urlInput"
          placeholder="https://example.com/very/long/url"
          required
        />
      </div>

      <div class="button-group">
        <button type="submit" class="btn-shorten">Shorten URL</button>
        <button type="reset" class="btn-clear">Clear</button>
      </div>
    </form>

    <div id="resultSection" class="result-section" style="display: none;">
      <div class="result-box">
        <div class="result-label">Short URL</div>
        <div class="result-value" id="shortUrl"></div>
        <button class="copy-btn" onclick="copyToClipboard('shortUrl')">Copy</button>
      </div>

      <div class="result-box">
        <div class="result-label">Original URL</div>
        <div class="result-value" id="originalUrl"></div>
        <button class="copy-btn" onclick="copyToClipboard('originalUrl')">Copy</button>
      </div>
    </div>

    <div class="urls-list" id="urlsList"></div>
  </div>

  <script>
    const form = document.getElementById('shortenForm');
    const urlInput = document.getElementById('urlInput');
    const resultSection = document.getElementById('resultSection');
    const successMessage = document.getElementById('successMessage');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();

      if (!url) {
        showError('Please enter a URL');
        return;
      }

      try {
        const response = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.error || 'Failed to shorten URL');
        }

        const data = await response.json();
        document.getElementById('shortUrl').textContent = data.shortUrl;
        document.getElementById('originalUrl').textContent = data.originalUrl;
        resultSection.style.display = 'block';
        showSuccess('URL shortened successfully!');
        loadUrls();
      } catch (err) {
        showError(err.message);
      }
    });

    function showSuccess(msg) {
      successMessage.textContent = msg;
      successMessage.classList.add('show');
      errorMessage.classList.remove('show');
      setTimeout(() => successMessage.classList.remove('show'), 5000);
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('show');
      successMessage.classList.remove('show');
      setTimeout(() => errorMessage.classList.remove('show'), 3000);
    }

    function copyToClipboard(elementId) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        showSuccess('Copied to clipboard!');
      });
    }

    async function loadUrls() {
      try {
        const response = await fetch('/api/urls');
        const urls = await response.json();
        const urlsList = document.getElementById('urlsList');

        if (urls.length === 0) {
          urlsList.innerHTML = '';
          return;
        }

        urlsList.innerHTML = '<h3>Recent URLs</h3>' + urls.slice(-5).reverse().map(item => `
          <div class="url-item">
            <div class="url-item-short"><a href="${item.shortUrl}" target="_blank">${item.shortUrl}</a></div>
            <div class="url-item-original">${item.originalUrl}</div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load URLs:', err);
      }
    }

    // Load URLs on page load
    loadUrls();
  </script>
</body>
</html>
