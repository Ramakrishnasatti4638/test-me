<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>📝 My Todo App</h1>
      <p>Organize your tasks and boost productivity</p>
    </header>

    <div class="main-content">
      <div class="input-section">
        <input 
          type="text" 
          id="titleInput" 
          class="input-field" 
          placeholder="What needs to be done?"
          autocomplete="off"
        >
        <textarea 
          id="descriptionInput" 
          class="textarea-field" 
          placeholder="Add a description (optional)"
        ></textarea>
        <button id="addBtn" class="btn btn-primary">Add Todo</button>
      </div>

      <div class="stats">
        <span id="totalCount" class="stat-item">Total: <strong>0</strong></span>
        <span id="completedCount" class="stat-item">Completed: <strong>0</strong></span>
        <span id="pendingCount" class="stat-item">Pending: <strong>0</strong></span>
      </div>

      <div class="todos-section">
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <div id="todosList" class="todos-list">
          <!-- Todos will be rendered here -->
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
