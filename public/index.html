<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="url"],
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="url"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 8px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-label {
      color: #666;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .result-content {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .result-url {
      flex: 1;
      padding: 10px 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      word-break: break-all;
      font-size: 14px;
      color: #667eea;
      font-weight: 500;
    }

    .copy-btn {
      padding: 10px 15px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #764ba2;
    }

    .copied-message {
      color: #22c55e;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }

    .copied-message.show {
      display: inline-block;
    }

    .error {
      color: #ef4444;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      font-weight: 600;
    }

    .loading.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Make your long URLs short and shareable</p>

    <form id="shortenForm">
      <div class="form-group">
        <label for="urlInput">Enter your URL</label>
        <input
          type="url"
          id="urlInput"
          placeholder="https://example.com/very/long/url"
          required
        >
      </div>

      <button type="submit">Shorten URL</button>

      <div class="error" id="error"></div>
      <div class="loading" id="loading">Processing...</div>
    </form>

    <div class="result" id="result">
      <div class="result-label">Your Shortened URL</div>
      <div class="result-content">
        <div class="result-url" id="resultUrl"></div>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <div class="copied-message" id="copiedMessage">✓ Copied!</div>
    </div>
  </div>

  <script>
    const form = document.getElementById('shortenForm');
    const urlInput = document.getElementById('urlInput');
    const result = document.getElementById('result');
    const resultUrl = document.getElementById('resultUrl');
    const copyBtn = document.getElementById('copyBtn');
    const copiedMessage = document.getElementById('copiedMessage');
    const errorDiv = document.getElementById('error');
    const loadingDiv = document.getElementById('loading');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();

      if (!url) {
        showError('Please enter a URL');
        return;
      }

      clearError();
      loadingDiv.classList.add('show');
      copyBtn.disabled = true;

      try {
        const response = await fetch('/api/shorten', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ url })
        });

        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.error || 'Failed to shorten URL');
        }

        const data = await response.json();
        resultUrl.textContent = data.shortUrl;
        result.classList.add('show');
        copiedMessage.classList.remove('show');
        copyBtn.disabled = false;
      } catch (err) {
        showError(err.message);
        result.classList.remove('show');
      } finally {
        loadingDiv.classList.remove('show');
      }
    });

    copyBtn.addEventListener('click', () => {
      const url = resultUrl.textContent;
      navigator.clipboard.writeText(url).then(() => {
        copiedMessage.classList.add('show');
        setTimeout(() => {
          copiedMessage.classList.remove('show');
        }, 2000);
      });
    });

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
    }

    function clearError() {
      errorDiv.classList.remove('show');
      errorDiv.textContent = '';
    }
  </script>
</body>
</html>
