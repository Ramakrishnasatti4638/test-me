<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .card__icon {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    h1 {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.4rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="url"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 0.6rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus { border-color: #667eea; }

    button {
      padding: 0.75rem 1.25rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 0.6rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      margin-top: 0.5rem;
      font-size: 0.83rem;
      color: #ef4444;
      min-height: 1.2em;
    }

    /* Result box */
    .result {
      margin-top: 1.75rem;
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      border-radius: 0.75rem;
      padding: 1.1rem 1.25rem;
      display: none;
    }

    .result.visible { display: block; }

    .result__label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #16a34a;
      margin-bottom: 0.4rem;
    }

    .result__link-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .result__link {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
      color: #15803d;
      word-break: break-all;
      text-decoration: none;
    }

    .result__link:hover { text-decoration: underline; }

    .copy-btn {
      padding: 0.4rem 0.85rem;
      font-size: 0.8rem;
      background: #16a34a;
      border-radius: 0.5rem;
    }

    .copy-btn:hover { opacity: 0.85; }

    /* History */
    .history { margin-top: 2rem; }

    .history h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.75rem;
      border-top: 1px solid #f3f4f6;
      padding-top: 1rem;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 220px;
      overflow-y: auto;
    }

    .history-list li {
      background: #f9fafb;
      border-radius: 0.5rem;
      padding: 0.6rem 0.85rem;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .history-list .original {
      color: #6b7280;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 55%;
    }

    .history-list a {
      color: #667eea;
      font-weight: 600;
      text-decoration: none;
    }

    .history-list a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card__icon">🔗</div>
    <h1>URL Shortener</h1>
    <p class="subtitle">Paste a long link, get a short one instantly.</p>

    <label for="urlInput">Long URL</label>
    <div class="input-row">
      <input
        type="url"
        id="urlInput"
        placeholder="https://example.com/very/long/url/here"
        autocomplete="off"
      />
      <button id="shortenBtn">Shorten</button>
    </div>
    <p class="error-msg" id="errorMsg"></p>

    <div class="result" id="result">
      <p class="result__label">✅ Your short link is ready!</p>
      <div class="result__link-row">
        <a class="result__link" id="shortLink" href="#"></a>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
    </div>

    <div class="history" id="historySection" style="display:none">
      <h2>Recent links</h2>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <script>
    const input    = document.getElementById('urlInput');
    const btn      = document.getElementById('shortenBtn');
    const errorMsg = document.getElementById('errorMsg');
    const result   = document.getElementById('result');
    const shortLink = document.getElementById('shortLink');
    const copyBtn  = document.getElementById('copyBtn');
    const historySection = document.getElementById('historySection');
    const historyList    = document.getElementById('historyList');

    const history = [];

    async function shorten() {
      const url = input.value.trim();
      errorMsg.textContent = '';
      result.classList.remove('visible');

      if (!url) {
        errorMsg.textContent = 'Please enter a URL.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Shortening…';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Something went wrong.';
          return;
        }

        shortLink.href = data.shortUrl;
        shortLink.textContent = data.shortUrl;
        result.classList.add('visible');

        // Add to history
        history.unshift({ original: url, short: data.shortUrl });
        renderHistory();

      } catch {
        errorMsg.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten';
      }
    }

    function renderHistory() {
      if (history.length === 0) {
        historySection.style.display = 'none';
        return;
      }
      historySection.style.display = 'block';
      historyList.innerHTML = history.map(item => `
        <li>
          <span class="original" title="${item.original}">${item.original}</span>
          <a href="${item.short}">${item.short}</a>
        </li>
      `).join('');
    }

    btn.addEventListener('click', shorten);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') shorten(); });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortLink.href).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
      });
    });
  </script>
</body>
</html>
