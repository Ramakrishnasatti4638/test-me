<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica',
                'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .content {
            padding: 20px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-section input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .input-section input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: 600;
            color: #667eea;
            font-size: 1.2rem;
        }

        .todos-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            transition: background-color 0.2s;
        }

        .todo-item:hover {
            background-color: #f9f9f9;
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-content {
            flex: 1;
            min-width: 0;
        }

        .todo-text {
            font-size: 1rem;
            word-break: break-word;
            margin-bottom: 4px;
        }

        .todo-desc {
            font-size: 0.85rem;
            color: #999;
            word-break: break-word;
        }

        .todo-actions {
            display: flex;
            gap: 8px;
        }

        .btn-delete {
            padding: 6px 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .footer {
            padding: 15px 20px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.9rem;
            color: #666;
        }

        .btn-clear {
            padding: 8px 16px;
            background: #ffb347;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .btn-clear:hover {
            background: #ff9500;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .stats {
                flex-direction: column;
                gap: 10px;
            }

            .input-section {
                flex-direction: column;
            }

            .footer {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Todo App</h1>
            <p>Stay organized and productive</p>
        </div>

        <div class="content" id="app">
            <div class="loading">Loading...</div>
        </div>

        <div class="footer">
            <span id="stats-text">0 tasks, 0 completed</span>
            <button class="btn-clear" id="clear-btn" style="display: none;">Clear Completed</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api';

        class TodoApp {
            constructor() {
                this.todos = [];
                this.init();
            }

            async init() {
                await this.loadTodos();
                this.render();
            }

            async loadTodos() {
                try {
                    const response = await fetch(`${API_URL}/todos`);
                    if (!response.ok) throw new Error('Failed to load todos');
                    this.todos = await response.json();
                } catch (error) {
                    console.error('Error loading todos:', error);
                    this.todos = [];
                }
            }

            async addTodo(title, description = '') {
                try {
                    const response = await fetch(`${API_URL}/todos`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, description })
                    });
                    if (!response.ok) throw new Error('Failed to add todo');
                    const newTodo = await response.json();
                    this.todos.unshift(newTodo);
                    this.render();
                } catch (error) {
                    console.error('Error adding todo:', error);
                }
            }

            async toggleTodo(id) {
                const todo = this.todos.find(t => t.id === id);
                if (!todo) return;

                try {
                    const response = await fetch(`${API_URL}/todos/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ completed: !todo.completed })
                    });
                    if (!response.ok) throw new Error('Failed to update todo');
                    todo.completed = !todo.completed;
                    this.render();
                } catch (error) {
                    console.error('Error toggling todo:', error);
                }
            }

            async deleteTodo(id) {
                try {
                    const response = await fetch(`${API_URL}/todos/${id}`, {
                        method: 'DELETE'
                    });
                    if (!response.ok) throw new Error('Failed to delete todo');
                    this.todos = this.todos.filter(t => t.id !== id);
                    this.render();
                } catch (error) {
                    console.error('Error deleting todo:', error);
                }
            }

            async clearCompleted() {
                try {
                    const response = await fetch(`${API_URL}/todos`, {
                        method: 'DELETE'
                    });
                    if (!response.ok) throw new Error('Failed to clear completed todos');
                    this.todos = this.todos.filter(t => !t.completed);
                    this.render();
                } catch (error) {
                    console.error('Error clearing completed todos:', error);
                }
            }

            render() {
                const app = document.getElementById('app');
                const completedCount = this.todos.filter(t => t.completed).length;
                const totalCount = this.todos.length;

                const statsText = document.getElementById('stats-text');
                statsText.textContent = `${totalCount} task${totalCount !== 1 ? 's' : ''}, ${completedCount} completed`;

                const clearBtn = document.getElementById('clear-btn');
                clearBtn.style.display = completedCount > 0 ? 'block' : 'none';

                let html = `
                    <div class="input-section">
                        <input type="text" id="todo-input" placeholder="Add a new task..." />
                        <button class="btn btn-primary" id="add-btn">Add</button>
                    </div>

                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-label">Total:</span>
                            <span class="stat-value">${totalCount}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Completed:</span>
                            <span class="stat-value">${completedCount}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Remaining:</span>
                            <span class="stat-value">${totalCount - completedCount}</span>
                        </div>
                    </div>
                `;

                if (this.todos.length === 0) {
                    html += `
                        <div class="empty-state">
                            <div>✨</div>
                            <p>No todos yet. Add one to get started!</p>
                        </div>
                    `;
                } else {
                    html += '<div class="todos-list">';
                    this.todos.forEach(todo => {
                        html += `
                            <div class="todo-item ${todo.completed ? 'completed' : ''}">
                                <input 
                                    type="checkbox" 
                                    class="todo-checkbox" 
                                    ${todo.completed ? 'checked' : ''} 
                                    onchange="app.toggleTodo('${todo.id}')"
                                />
                                <div class="todo-content">
                                    <div class="todo-text">${this.escapeHtml(todo.title)}</div>
                                    ${todo.description ? `<div class="todo-desc">${this.escapeHtml(todo.description)}</div>` : ''}
                                </div>
                                <div class="todo-actions">
                                    <button class="btn-delete" onclick="app.deleteTodo('${todo.id}')">Delete</button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                app.innerHTML = html;

                const addBtn = document.getElementById('add-btn');
                const todoInput = document.getElementById('todo-input');

                const handleAdd = () => {
                    const value = todoInput.value.trim();
                    if (value) {
                        this.addTodo(value);
                        todoInput.value = '';
                        todoInput.focus();
                    }
                };

                addBtn.onclick = handleAdd;
                todoInput.onkeypress = (e) => {
                    if (e.key === 'Enter') handleAdd();
                };

                todoInput.focus();
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        const app = new TodoApp();

        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('Clear all completed tasks?')) {
                app.clearCompleted();
            }
        });
    </script>
</body>
</html>
