<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    input[type="text"]::placeholder {
      color: #aaa;
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .message {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .message.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
      display: block;
    }

    .message.success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
      display: block;
    }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 8px;
      display: none;
    }

    .result-box.show {
      display: block;
    }

    .result-label {
      color: #666;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .result-url {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .result-url input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      background: white;
    }

    .copy-btn {
      padding: 8px 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: #764ba2;
    }

    .copy-btn.copied {
      background: #3c3;
    }

    .history {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #f0f0f0;
    }

    .history h2 {
      color: #333;
      font-size: 16px;
      margin-bottom: 16px;
    }

    .history-item {
      padding: 12px;
      background: #f9f9f9;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .history-item-url {
      flex: 1;
      overflow: hidden;
    }

    .history-item-original {
      color: #666;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-short {
      color: #667eea;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-empty {
      color: #aaa;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .input-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Make your long URLs short and shareable</p>

    <div class="input-group">
      <input 
        type="text" 
        id="urlInput" 
        placeholder="Paste your long URL here..." 
        autocomplete="off"
      >
      <button onclick="shortenUrl()">Shorten</button>
    </div>

    <div id="message" class="message"></div>

    <div id="resultBox" class="result-box">
      <div class="result-label">Your short URL</div>
      <div class="result-url">
        <input type="text" id="shortUrlInput" readonly>
        <button class="copy-btn" onclick="copyToClipboard()">Copy</button>
      </div>
    </div>

    <div class="history">
      <h2>Recent URLs</h2>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const messageEl = document.getElementById('message');
    const resultBox = document.getElementById('resultBox');
    const shortUrlInput = document.getElementById('shortUrlInput');
    const historyList = document.getElementById('historyList');

    let history = JSON.parse(localStorage.getItem('urlHistory') || '[]');

    // Load history on page load
    function loadHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<div class="history-empty">No URLs shortened yet</div>';
        return;
      }

      historyList.innerHTML = history
        .map(item => `
          <div class="history-item">
            <div class="history-item-url">
              <div class="history-item-original" title="${item.original}">Original: ${item.original}</div>
              <div class="history-item-short" title="${item.short}">Short: ${item.short}</div>
            </div>
            <button class="copy-btn" onclick="copyHistoryItem('${item.short}')">Copy</button>
          </div>
        `)
        .join('');
    }

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
      if (type === 'success') {
        setTimeout(() => {
          messageEl.className = 'message';
        }, 3000);
      }
    }

    function copyToClipboard() {
      shortUrlInput.select();
      document.execCommand('copy');
      
      const btn = event.target;
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 2000);
    }

    function copyHistoryItem(url) {
      const dummy = document.createElement('textarea');
      dummy.value = url;
      document.body.appendChild(dummy);
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);

      const btn = event.target;
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 2000);
    }

    async function shortenUrl() {
      const url = urlInput.value.trim();

      if (!url) {
        showMessage('Please enter a URL', 'error');
        return;
      }

      try {
        const response = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage(data.error || 'Failed to shorten URL', 'error');
          return;
        }

        shortUrlInput.value = data.shortUrl;
        resultBox.classList.add('show');
        urlInput.value = '';
        showMessage('URL shortened successfully!', 'success');

        // Add to history
        history.unshift({ original: url, short: data.shortUrl });
        history = history.slice(0, 10); // Keep only last 10
        localStorage.setItem('urlHistory', JSON.stringify(history));
        loadHistory();
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
      }
    }

    // Allow Enter key to shorten URL
    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        shortenUrl();
      }
    });

    // Initialize
    loadHistory();
  </script>
</body>
</html>
