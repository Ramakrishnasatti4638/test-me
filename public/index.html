<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #273549;
      --border: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: #e0e7ff;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    header .logo-icon {
      width: 44px; height: 44px;
      background: var(--accent);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Main card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 32px;
    }

    /* Input group */
    .input-group {
      display: flex;
      gap: 10px;
    }
    .input-group input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input::placeholder { color: var(--text-muted); }
    .input-group input:focus { border-color: var(--accent); }

    button.btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 22px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    button.btn-primary:hover { background: var(--accent-hover); }
    button.btn-primary:active { transform: scale(0.97); }
    button.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Error / info message */
    .msg {
      margin-top: 12px;
      font-size: 0.875rem;
      border-radius: 8px;
      padding: 10px 14px;
      display: none;
    }
    .msg.error { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); display: block; }
    .msg.success { background: rgba(34,197,94,0.12); color: #86efac; border: 1px solid rgba(34,197,94,0.25); display: block; }

    /* Result box */
    #result-box {
      display: none;
      margin-top: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
    }
    #result-box .result-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    #result-box .result-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #result-box .short-link {
      flex: 1;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent-light);
      word-break: break-all;
      text-decoration: none;
    }
    #result-box .short-link:hover { text-decoration: underline; }

    button.btn-copy {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 7px;
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    button.btn-copy:hover { border-color: var(--accent); color: var(--text); }
    button.btn-copy.copied { border-color: var(--success); color: var(--success); }

    /* History */
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 640px;
    }
    .section-title span { color: var(--text); }

    #history-list {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .history-item .hi-icon {
      width: 38px; height: 38px; flex-shrink: 0;
      background: rgba(99,102,241,0.15);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .history-item .hi-body { flex: 1; min-width: 0; }
    .history-item .hi-short a {
      font-weight: 600;
      color: var(--accent-light);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .history-item .hi-short a:hover { text-decoration: underline; }
    .history-item .hi-original {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .history-item .hi-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: right;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .history-item .hi-meta .clicks {
      background: rgba(99,102,241,0.15);
      color: var(--accent-light);
      border-radius: 20px;
      padding: 2px 9px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .history-item .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .history-item .btn-delete:hover { color: var(--danger); background: rgba(239,68,68,0.1); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">🔗</div>
      <h1>URL Shortener</h1>
    </div>
    <p>Paste a long URL and get a short, shareable link instantly.</p>
  </header>

  <div class="card">
    <div class="input-group">
      <input type="url" id="url-input" placeholder="https://example.com/very/long/url..." autocomplete="off" />
      <button class="btn-primary" id="shorten-btn" onclick="shortenUrl()">Shorten</button>
    </div>
    <div class="msg" id="msg"></div>

    <div id="result-box">
      <div class="result-label">Your short link</div>
      <div class="result-row">
        <a class="short-link" id="short-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        <button class="btn-copy" id="copy-btn" onclick="copyLink()">Copy</button>
      </div>
    </div>
  </div>

  <div class="section-title">
    <span>Recent Links</span>
    <span id="link-count" style="font-size:0.8rem; color: var(--text-muted);"></span>
  </div>

  <div id="history-list"></div>

  <script>
    const BASE_URL = window.location.origin;

    async function shortenUrl() {
      const input = document.getElementById('url-input');
      const btn = document.getElementById('shorten-btn');
      const msg = document.getElementById('msg');
      const url = input.value.trim();

      msg.className = 'msg';
      msg.textContent = '';

      if (!url) {
        showMsg('Please enter a URL.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(data.error || 'Something went wrong.', 'error');
          return;
        }

        const shortUrl = `${BASE_URL}/${data.shortCode}`;
        const linkEl = document.getElementById('short-link');
        linkEl.href = shortUrl;
        linkEl.textContent = shortUrl;

        const copyBtn = document.getElementById('copy-btn');
        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('copied');

        document.getElementById('result-box').style.display = 'block';
        input.value = '';
        loadHistory();
      } catch (err) {
        showMsg('Network error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten';
      }
    }

    async function copyLink() {
      const link = document.getElementById('short-link').textContent;
      try {
        await navigator.clipboard.writeText(link);
        const btn = document.getElementById('copy-btn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      } catch {
        showMsg('Could not copy to clipboard.', 'error');
      }
    }

    async function deleteLink(code) {
      try {
        await fetch(`/api/urls/${code}`, { method: 'DELETE' });
        // If the deleted link is shown in result box, hide it
        const resultBox = document.getElementById('result-box');
        const shortLink = document.getElementById('short-link');
        if (shortLink.href.includes(code)) {
          resultBox.style.display = 'none';
        }
        loadHistory();
      } catch {
        showMsg('Could not delete link.', 'error');
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch('/api/urls');
        const urls = await res.json();
        renderHistory(urls);
      } catch {
        // silent
      }
    }

    function renderHistory(urls) {
      const container = document.getElementById('history-list');
      const countEl = document.getElementById('link-count');

      countEl.textContent = urls.length > 0 ? `${urls.length} link${urls.length > 1 ? 's' : ''}` : '';

      if (urls.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔗</div>
            <div>No links shortened yet. Paste a URL above to get started!</div>
          </div>`;
        return;
      }

      container.innerHTML = urls.map(entry => {
        const shortUrl = `${BASE_URL}/${entry.shortCode}`;
        const date = new Date(entry.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        return `
          <div class="history-item">
            <div class="hi-icon">🔗</div>
            <div class="hi-body">
              <div class="hi-short"><a href="${shortUrl}" target="_blank" rel="noopener noreferrer">${shortUrl}</a></div>
              <div class="hi-original" title="${escHtml(entry.originalUrl)}">${escHtml(entry.originalUrl)}</div>
            </div>
            <div class="hi-meta">
              <span class="clicks">${entry.clicks} click${entry.clicks !== 1 ? 's' : ''}</span>
              <span>${date}</span>
            </div>
            <button class="btn-delete" title="Delete" onclick="deleteLink('${entry.shortCode}')">🗑</button>
          </div>`;
      }).join('');
    }

    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showMsg(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = `msg ${type}`;
    }

    // Shorten on Enter key
    document.getElementById('url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') shortenUrl();
    });

    // Initial load
    loadHistory();
  </script>
</body>
</html>
