<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Color Emoji', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Color Emoji', sans-serif;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        button:disabled:hover {
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .result-value {
            background: white;
            padding: 12px;
            border-radius: 6px;
            color: #333;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            color: #27ae60;
            font-size: 12px;
            margin-top: 5px;
            display: none;
            font-weight: 500;
            background: #e8f8f5;
            padding: 8px 12px;
            border-radius: 4px;
            border-left: 3px solid #27ae60;
        }

        .success.show {
            display: block;
            animation: fadeInOut 0.3s ease;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 URL Shortener</h1>
        <p class="subtitle">Paste a long URL and we'll make it short</p>

        <form id="shortenForm">
            <div class="form-group">
                <label for="urlInput">Enter your URL</label>
                <input
                    type="text"
                    id="urlInput"
                    placeholder="https://example.com/very/long/url"
                    required
                >
            </div>
            <button type="submit">Shorten URL</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Creating your short URL...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="result-label">Original URL</div>
            <div class="result-value" id="originalUrl"></div>

            <div class="result-label" style="margin-top: 15px;">Short URL</div>
            <div class="result-value">
                <span id="shortUrl"></span>
                <button class="copy-btn" onclick="copyToClipboard('shortUrl')">Copy</button>
            </div>
            <div class="success" id="copySuccess">Copied to clipboard!</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('shortenForm');
        const urlInput = document.getElementById('urlInput');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const result = document.getElementById('result');
        const originalUrlEl = document.getElementById('originalUrl');
        const shortUrlEl = document.getElementById('shortUrl');
        const copySuccess = document.getElementById('copySuccess');
        const submitButton = form.querySelector('button[type="submit"]');
        let successTimeout;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();

            // Reset UI
            error.classList.remove('show');
            result.classList.remove('show');
            copySuccess.classList.remove('show');
            loading.classList.add('show');
            
            // Disable button during submission
            submitButton.disabled = true;

            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Failed to shorten URL');
                }

                const data = await response.json();
                loading.classList.remove('show');

                originalUrlEl.textContent = data.originalUrl;
                shortUrlEl.textContent = data.shortUrl;
                result.classList.add('show');
                urlInput.value = '';
                submitButton.disabled = false;
            } catch (err) {
                loading.classList.remove('show');
                error.textContent = err.message || 'An error occurred';
                error.classList.add('show');
                submitButton.disabled = false;
            }
        });

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            
            // Clear any existing timeout
            if (successTimeout) {
                clearTimeout(successTimeout);
            }
            
            navigator.clipboard.writeText(text).then(() => {
                copySuccess.classList.add('show');
                successTimeout = setTimeout(() => {
                    copySuccess.classList.remove('show');
                }, 3000);
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                copySuccess.classList.add('show');
                successTimeout = setTimeout(() => {
                    copySuccess.classList.remove('show');
                }, 3000);
            });
        }
    </script>
</body>
</html>
