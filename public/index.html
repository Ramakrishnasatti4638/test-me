<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
      color: #e0e0e0;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.6rem;
      font-weight: 800;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 8px;
      color: #9ca3af;
      font-size: 1rem;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      backdrop-filter: blur(12px);
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input::placeholder { color: #6b7280; }
    .input-row input:focus { border-color: #a78bfa; }

    .input-row button {
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .input-row button:hover { opacity: 0.88; }
    .input-row button:active { transform: scale(0.97); }

    #error-msg {
      margin-top: 10px;
      color: #f87171;
      font-size: 0.88rem;
      min-height: 18px;
    }

    #result-box {
      margin-top: 20px;
      display: none;
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 12px;
      padding: 16px 20px;
    }

    #result-box p { font-size: 0.82rem; color: #9ca3af; margin-bottom: 6px; }

    .result-link-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #short-link {
      color: #a78bfa;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      word-break: break-all;
    }

    #short-link:hover { text-decoration: underline; }

    #copy-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(167,139,250,0.4);
      background: transparent;
      color: #a78bfa;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #copy-btn:hover { background: rgba(167,139,250,0.15); }

    /* History table */
    .history {
      margin-top: 40px;
      width: 100%;
      max-width: 700px;
    }

    .history h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #d1d5db;
      margin-bottom: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    thead th {
      text-align: left;
      padding: 10px 14px;
      color: #6b7280;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.15s;
    }

    tbody tr:hover { background: rgba(255,255,255,0.04); }

    tbody td {
      padding: 12px 14px;
      vertical-align: middle;
    }

    .orig-url {
      color: #9ca3af;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .short-url a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 500;
    }

    .short-url a:hover { text-decoration: underline; }

    .clicks-badge {
      display: inline-block;
      background: rgba(96,165,250,0.15);
      color: #60a5fa;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    #empty-state {
      text-align: center;
      color: #4b5563;
      padding: 24px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <h1>⚡ URL Shortener</h1>
  <p>Paste a long URL and get a short, shareable link instantly.</p>
</header>

<div class="card">
  <div class="input-row">
    <input type="text" id="url-input" placeholder="https://example.com/very/long/url..." />
    <button id="shorten-btn">Shorten</button>
  </div>
  <div id="error-msg"></div>
  <div id="result-box">
    <p>Your short link is ready:</p>
    <div class="result-link-row">
      <a id="short-link" href="#" target="_blank" rel="noopener noreferrer"></a>
      <button id="copy-btn">Copy</button>
    </div>
  </div>
</div>

<div class="history">
  <h2>Recent Links</h2>
  <table id="links-table">
    <thead>
      <tr>
        <th>Original URL</th>
        <th>Short Link</th>
        <th>Clicks</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody id="links-tbody">
      <tr><td colspan="4" id="empty-state">No links yet. Shorten your first URL above!</td></tr>
    </tbody>
  </table>
</div>

<script>
  const input   = document.getElementById('url-input');
  const btn     = document.getElementById('shorten-btn');
  const errMsg  = document.getElementById('error-msg');
  const resultBox = document.getElementById('result-box');
  const shortLink = document.getElementById('short-link');
  const copyBtn = document.getElementById('copy-btn');
  const tbody   = document.getElementById('links-tbody');

  async function loadLinks() {
    try {
      const res = await fetch('/api/links');
      const links = await res.json();
      renderLinks(links);
    } catch {}
  }

  function renderLinks(links) {
    if (!links.length) {
      tbody.innerHTML = '<tr><td colspan="4" id="empty-state">No links yet. Shorten your first URL above!</td></tr>';
      return;
    }
    tbody.innerHTML = links.reverse().map(l => {
      const short = `${location.origin}/${l.code}`;
      const date  = new Date(l.createdAt).toLocaleString();
      return `<tr>
        <td class="orig-url" title="${escHtml(l.originalUrl)}">${escHtml(l.originalUrl)}</td>
        <td class="short-url"><a href="${escHtml(short)}" target="_blank" rel="noopener noreferrer">${escHtml(short)}</a></td>
        <td><span class="clicks-badge">${l.clicks}</span></td>
        <td>${date}</td>
      </tr>`;
    }).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  btn.addEventListener('click', shorten);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') shorten(); });

  async function shorten() {
    errMsg.textContent = '';
    resultBox.style.display = 'none';
    const url = input.value.trim();
    if (!url) { errMsg.textContent = 'Please enter a URL.'; return; }

    btn.disabled = true;
    btn.textContent = 'Shortening…';

    try {
      const res = await fetch('/api/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();

      if (!res.ok) { errMsg.textContent = data.error || 'Something went wrong.'; return; }

      shortLink.href = data.shortUrl;
      shortLink.textContent = data.shortUrl;
      resultBox.style.display = 'block';
      input.value = '';
      await loadLinks();
    } catch {
      errMsg.textContent = 'Network error. Please try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Shorten';
    }
  }

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(shortLink.href).then(() => {
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = 'Copy', 1800);
    });
  });

  loadLinks();
</script>
</body>
</html>
