<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #e2e8f0;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1.8rem;
    }

    .logo svg { width: 32px; height: 32px; }

    .logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    label {
      display: block;
      font-size: .875rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: .4rem;
    }

    .input-row {
      display: flex;
      gap: .6rem;
    }

    input[type="url"] {
      flex: 1;
      padding: .75rem 1rem;
      border-radius: .75rem;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }

    input[type="url"]:focus { border-color: #a78bfa; }
    input[type="url"]::placeholder { color: #475569; }

    button#shorten-btn {
      padding: .75rem 1.4rem;
      border-radius: .75rem;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      white-space: nowrap;
    }

    button#shorten-btn:hover { opacity: .9; }
    button#shorten-btn:active { transform: scale(.97); }
    button#shorten-btn:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg {
      margin-top: .6rem;
      font-size: .82rem;
      color: #f87171;
      min-height: 1.2em;
    }

    .result-box {
      margin-top: 1.4rem;
      background: rgba(124,58,237,.15);
      border: 1px solid rgba(124,58,237,.4);
      border-radius: .9rem;
      padding: 1rem 1.2rem;
      display: none;
      animation: fadeIn .3s ease;
    }

    .result-box p { font-size: .8rem; color: #94a3b8; margin-bottom: .35rem; }

    .result-link-row {
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    .result-link-row a {
      font-size: 1.05rem;
      font-weight: 600;
      color: #a78bfa;
      text-decoration: none;
      word-break: break-all;
    }

    .result-link-row a:hover { text-decoration: underline; }

    button.copy-btn {
      margin-left: auto;
      flex-shrink: 0;
      padding: .35rem .8rem;
      border-radius: .5rem;
      border: 1px solid rgba(167,139,250,.4);
      background: transparent;
      color: #a78bfa;
      font-size: .8rem;
      cursor: pointer;
      transition: background .2s;
    }

    button.copy-btn:hover { background: rgba(167,139,250,.15); }

    .history {
      margin-top: 2rem;
    }

    .history h2 {
      font-size: .95rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: .8rem;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .55rem;
      max-height: 240px;
      overflow-y: auto;
    }

    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

    .history-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: .65rem;
      padding: .65rem .9rem;
      display: flex;
      flex-direction: column;
      gap: .2rem;
    }

    .history-item .short {
      font-size: .9rem;
      font-weight: 600;
    }

    .history-item .short a {
      color: #60a5fa;
      text-decoration: none;
    }

    .history-item .short a:hover { text-decoration: underline; }

    .history-item .original {
      font-size: .75rem;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-history {
      font-size: .85rem;
      color: #334155;
      text-align: center;
      padding: 1rem 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#60a5fa"/>
          </linearGradient>
        </defs>
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <h1>Snip URL</h1>
    </div>

    <label for="url-input">Paste a long URL</label>
    <div class="input-row">
      <input id="url-input" type="url" placeholder="https://example.com/very/long/path" autocomplete="off" />
      <button id="shorten-btn">Shorten</button>
    </div>
    <div class="error-msg" id="error-msg"></div>

    <div class="result-box" id="result-box">
      <p>Your short link is ready</p>
      <div class="result-link-row">
        <a id="result-link" href="#" target="_blank"></a>
        <button class="copy-btn" id="copy-btn">Copy</button>
      </div>
    </div>

    <div class="history">
      <h2>Recent Links</h2>
      <ul class="history-list" id="history-list">
        <li class="empty-history" id="empty-msg">No links shortened yet.</li>
      </ul>
    </div>
  </div>

  <script>
    const btn       = document.getElementById('shorten-btn');
    const input     = document.getElementById('url-input');
    const errorMsg  = document.getElementById('error-msg');
    const resultBox = document.getElementById('result-box');
    const resultLink = document.getElementById('result-link');
    const copyBtn   = document.getElementById('copy-btn');
    const histList  = document.getElementById('history-list');
    const emptyMsg  = document.getElementById('empty-msg');

    const history = [];

    async function shorten() {
      errorMsg.textContent = '';
      const url = input.value.trim();
      if (!url) { errorMsg.textContent = 'Please enter a URL.'; return; }

      btn.disabled = true;
      btn.textContent = 'Shortening…';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) { errorMsg.textContent = data.error || 'Something went wrong.'; return; }

        const full = window.location.origin + data.shortUrl;
        resultLink.href = data.shortUrl;
        resultLink.textContent = full;
        resultBox.style.display = 'block';

        // Add to history
        history.unshift({ short: full, shortPath: data.shortUrl, original: url });
        renderHistory();
        input.value = '';
      } catch {
        errorMsg.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten';
      }
    }

    function renderHistory() {
      histList.innerHTML = '';
      if (history.length === 0) {
        histList.innerHTML = '<li class="empty-history" id="empty-msg">No links shortened yet.</li>';
        return;
      }
      history.forEach(({ short, shortPath, original }) => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <span class="short"><a href="${shortPath}" target="_blank">${short}</a></span>
          <span class="original" title="${original}">${original}</span>
        `;
        histList.appendChild(li);
      });
    }

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(resultLink.textContent).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
      });
    });

    btn.addEventListener('click', shorten);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') shorten(); });
  </script>
</body>
</html>
