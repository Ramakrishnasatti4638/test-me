<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #6c63ff;
      --accent-hover: #857dff;
      --accent-light: rgba(108, 99, 255, 0.12);
      --text: #e8eaf6;
      --muted: #8b90b3;
      --error: #ff6b6b;
      --success: #43e97b;
      --danger: #ff4d4f;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .logo-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
    header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      width: 100%;
      max-width: 620px;
      margin-bottom: 28px;
    }

    /* Input row */
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-row input:focus { border-color: var(--accent); }
    .input-row input::placeholder { color: var(--muted); }

    .btn {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Message */
    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }
    .message.error { background: rgba(255,107,107,0.12); color: var(--error); border: 1px solid rgba(255,107,107,0.3); display: block; }
    .message.success { background: rgba(67,233,123,0.1); color: var(--success); border: 1px solid rgba(67,233,123,0.25); display: block; }

    /* Result box */
    .result-box {
      margin-top: 16px;
      background: var(--accent-light);
      border: 1px solid rgba(108,99,255,0.3);
      border-radius: 12px;
      padding: 16px;
      display: none;
    }
    .result-box.show { display: block; }
    .result-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
    .result-url-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .result-url {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: var(--accent-hover);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-copy {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      font-size: 0.85rem;
      border-radius: 8px;
    }
    .btn-copy:hover { border-color: var(--accent); color: var(--accent); }

    /* Stats */
    .stats {
      display: flex;
      gap: 20px;
      margin-top: 12px;
    }
    .stat { font-size: 0.8rem; color: var(--muted); }
    .stat span { color: var(--text); font-weight: 600; }

    /* History section */
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .url-list { display: flex; flex-direction: column; gap: 10px; }

    .url-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .url-item:hover { border-color: var(--accent); }

    .url-item-icon {
      width: 36px; height: 36px;
      background: var(--accent-light);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .url-item-info { flex: 1; min-width: 0; }
    .url-item-short {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-hover);
      text-decoration: none;
    }
    .url-item-short:hover { text-decoration: underline; }
    .url-item-original {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .url-item-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .clicks-badge {
      background: var(--accent-light);
      border: 1px solid rgba(108,99,255,0.25);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.75rem;
      color: var(--accent-hover);
      font-weight: 600;
    }
    .url-date { font-size: 0.72rem; color: var(--muted); }

    .url-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 32px; height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
    .btn-icon.delete:hover { border-color: var(--danger); color: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 32px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .empty-state p { font-size: 0.9rem; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #2d3250;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 0.9rem;
      color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
      z-index: 1000;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔗</div>
    <h1>URL Shortener</h1>
  </div>
  <p>Paste a long URL and get a short, shareable link instantly</p>
</header>

<!-- Shorten card -->
<div class="card">
  <div class="input-row">
    <input type="url" id="urlInput" placeholder="https://example.com/very/long/url/goes/here" autocomplete="off" />
    <button class="btn btn-primary" id="shortenBtn" onclick="shortenUrl()">Shorten</button>
  </div>

  <div class="message" id="message"></div>

  <div class="result-box" id="resultBox">
    <div class="result-label">Your short link</div>
    <div class="result-url-row">
      <div class="result-url" id="resultUrl"></div>
      <button class="btn btn-copy" onclick="copyResult()">Copy</button>
    </div>
    <div class="stats">
      <div class="stat">Clicks: <span id="resultClicks">0</span></div>
    </div>
  </div>
</div>

<!-- History card -->
<div class="card">
  <div class="section-title">
    Recent Links
    <span class="badge" id="countBadge">0</span>
  </div>
  <div class="url-list" id="urlList">
    <div class="empty-state">
      <div class="icon">✂️</div>
      <p>No links yet. Shorten your first URL above!</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let currentShortUrl = '';

  async function shortenUrl() {
    const input = document.getElementById('urlInput');
    const url = input.value.trim();
    const btn = document.getElementById('shortenBtn');

    showMessage('', '');
    hideResult();

    if (!url) {
      showMessage('Please enter a URL.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Shortening…';

    try {
      const res = await fetch('/api/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();

      if (!res.ok) {
        showMessage(data.error || 'Something went wrong.', 'error');
        return;
      }

      currentShortUrl = data.shortUrl;
      document.getElementById('resultUrl').textContent = data.shortUrl;
      document.getElementById('resultClicks').textContent = '0';
      document.getElementById('resultBox').classList.add('show');
      showMessage('', '');
      input.value = '';
      loadUrls();
    } catch {
      showMessage('Network error. Please try again.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Shorten';
    }
  }

  function showMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = 'message' + (type ? ' ' + type : '');
  }

  function hideResult() {
    document.getElementById('resultBox').classList.remove('show');
  }

  function copyResult() {
    copyToClipboard(currentShortUrl);
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('Copied to clipboard!');
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied to clipboard!');
    });
  }

  async function loadUrls() {
    try {
      const res = await fetch('/api/urls');
      const urls = await res.json();
      renderUrls(urls);
    } catch {
      // silently fail
    }
  }

  function renderUrls(urls) {
    const list = document.getElementById('urlList');
    document.getElementById('countBadge').textContent = urls.length;

    if (!urls.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">✂️</div>
          <p>No links yet. Shorten your first URL above!</p>
        </div>`;
      return;
    }

    list.innerHTML = urls.map(u => `
      <div class="url-item" id="item-${u.shortCode}">
        <div class="url-item-icon">🔗</div>
        <div class="url-item-info">
          <a class="url-item-short" href="/${u.shortCode}" target="_blank">${u.shortUrl}</a>
          <div class="url-item-original" title="${escapeHtml(u.originalUrl)}">${escapeHtml(u.originalUrl)}</div>
        </div>
        <div class="url-item-meta">
          <span class="clicks-badge">${u.clicks} click${u.clicks !== 1 ? 's' : ''}</span>
          <span class="url-date">${formatDate(u.createdAt)}</span>
        </div>
        <div class="url-item-actions">
          <button class="btn-icon" title="Copy" onclick="copyToClipboard('${escapeHtml(u.shortUrl)}')">📋</button>
          <button class="btn-icon delete" title="Delete" onclick="deleteUrl('${u.shortCode}')">🗑️</button>
        </div>
      </div>
    `).join('');
  }

  async function deleteUrl(code) {
    try {
      const res = await fetch(`/api/urls/${code}`, { method: 'DELETE' });
      if (res.ok) {
        showToast('Link deleted');
        loadUrls();
      }
    } catch {
      showToast('Failed to delete');
    }
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Allow Enter key to trigger shorten
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') shortenUrl();
  });

  // Initial load
  loadUrls();
</script>
</body>
</html>
