<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔗 URL Shortener</h1>
      <p class="subtitle">Make your long URLs short and shareable</p>
    </header>

    <main>
      <section class="shortener-section">
        <form id="shortenForm">
          <div class="form-group">
            <label for="urlInput">Enter URL to shorten:</label>
            <input
              type="url"
              id="urlInput"
              placeholder="https://example.com/very/long/url/path"
              required
            >
          </div>
          <button type="submit" class="btn btn-primary">Shorten URL</button>
        </form>

        <div id="result" class="result hidden">
          <div class="result-content">
            <div class="result-item">
              <label>Original URL:</label>
              <p id="originalUrl" class="url-text"></p>
            </div>
            <div class="result-item">
              <label>Shortened URL:</label>
              <div class="url-display">
                <p id="shortUrl" class="url-text"></p>
                <button type="button" class="btn btn-secondary btn-copy" id="copyBtn">Copy</button>
              </div>
            </div>
            <div class="result-item">
              <label>Short Code:</label>
              <p id="shortCode" class="url-text"></p>
            </div>
          </div>
        </div>

        <div id="error" class="error hidden"></div>
      </section>

      <section class="history-section">
        <h2>Recent Links</h2>
        <div id="historyList" class="history-list">
          <p class="empty-message">No links created yet</p>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
