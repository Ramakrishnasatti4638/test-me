<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
      color: #e2e8f0;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.6rem;
      font-weight: 800;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 1rem;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]::placeholder { color: #64748b; }

    input[type="url"]:focus {
      border-color: #a78bfa;
    }

    button#shortenBtn {
      padding: 13px 22px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button#shortenBtn:hover { opacity: 0.88; }
    button#shortenBtn:active { transform: scale(0.97); }

    #errorMsg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 8px;
      min-height: 1.2em;
    }

    .result-box {
      display: none;
      margin-top: 20px;
      background: rgba(167,139,250,0.12);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .result-box label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
    }

    .result-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    #shortUrlDisplay {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
      color: #a78bfa;
      text-decoration: none;
      word-break: break-all;
    }

    #shortUrlDisplay:hover { text-decoration: underline; }

    button#copyBtn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid rgba(167,139,250,0.4);
      background: transparent;
      color: #a78bfa;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button#copyBtn:hover { background: rgba(167,139,250,0.15); }

    /* History */
    .history {
      width: 100%;
      max-width: 560px;
      margin-top: 32px;
    }

    .history h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    #linkList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #linkList li {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .link-short a {
      font-weight: 600;
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .link-short a:hover { text-decoration: underline; }

    .link-original {
      font-size: 0.8rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      text-align: center;
      color: #475569;
      font-size: 0.9rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ URL Shortener</h1>
    <p>Paste a long URL and get a short, shareable link instantly.</p>
  </header>

  <div class="card">
    <div class="input-row">
      <input id="urlInput" type="url" placeholder="https://example.com/very/long/url" />
      <button id="shortenBtn">Shorten</button>
    </div>
    <div id="errorMsg"></div>

    <div class="result-box" id="resultBox">
      <label>Your short link</label>
      <div class="result-row">
        <a id="shortUrlDisplay" href="#" target="_blank" rel="noopener noreferrer"></a>
        <button id="copyBtn">Copy</button>
      </div>
    </div>
  </div>

  <div class="history">
    <h2>Recent links</h2>
    <ul id="linkList"><li class="empty-state">No links yet.</li></ul>
  </div>

  <script>
    const urlInput   = document.getElementById('urlInput');
    const shortenBtn = document.getElementById('shortenBtn');
    const errorMsg   = document.getElementById('errorMsg');
    const resultBox  = document.getElementById('resultBox');
    const shortUrlEl = document.getElementById('shortUrlDisplay');
    const copyBtn    = document.getElementById('copyBtn');
    const linkList   = document.getElementById('linkList');

    async function loadLinks() {
      const res = await fetch('/api/links');
      const links = await res.json();
      renderList(links);
    }

    function renderList(links) {
      if (!links.length) {
        linkList.innerHTML = '<li class="empty-state">No links yet.</li>';
        return;
      }
      const host = location.origin;
      linkList.innerHTML = links.map(({ code, originalUrl }) => `
        <li>
          <span class="link-short">
            <a href="${host}/${code}" target="_blank" rel="noopener noreferrer">${host}/${code}</a>
          </span>
          <span class="link-original" title="${escHtml(originalUrl)}">${escHtml(originalUrl)}</span>
        </li>
      `).join('');
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    shortenBtn.addEventListener('click', async () => {
      errorMsg.textContent = '';
      resultBox.style.display = 'none';
      const url = urlInput.value.trim();

      if (!url) {
        errorMsg.textContent = 'Please enter a URL.';
        return;
      }

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Something went wrong.';
          return;
        }

        shortUrlEl.textContent = data.shortUrl;
        shortUrlEl.href = data.shortUrl;
        resultBox.style.display = 'block';
        loadLinks();
      } catch {
        errorMsg.textContent = 'Network error. Please try again.';
      }
    });

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') shortenBtn.click();
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortUrlEl.textContent).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 1800);
      });
    });

    loadLinks();
  </script>
</body>
</html>
