<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 36px;
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="url"] {
      flex: 1;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 0.95rem;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]::placeholder { color: #475569; }
    input[type="url"]:focus { border-color: #6366f1; }

    button.shorten-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 14px 22px;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button.shorten-btn:hover { opacity: 0.9; }
    button.shorten-btn:active { transform: scale(0.97); }
    button.shorten-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      color: #fca5a5;
      font-size: 0.88rem;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: none;
    }

    .result-box {
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 14px;
      padding: 20px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .result-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 8px;
    }

    .result-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .short-url {
      flex: 1;
      color: #818cf8;
      font-size: 1.05rem;
      font-weight: 600;
      word-break: break-all;
      text-decoration: none;
    }

    .short-url:hover { text-decoration: underline; }

    .copy-btn {
      background: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 8px;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 14px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .copy-btn:hover { border-color: #6366f1; color: #818cf8; }
    .copy-btn.copied { border-color: #22c55e; color: #22c55e; }

    .stats-row {
      margin-top: 14px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .stat {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.82rem;
      color: #94a3b8;
    }

    .stat span { color: #e2e8f0; font-weight: 600; }

    .history-section { margin-top: 36px; }

    .history-title {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 12px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
    }

    .history-item {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.25s ease;
    }

    .history-item-info { flex: 1; overflow: hidden; }

    .history-short {
      color: #818cf8;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
    }

    .history-short:hover { text-decoration: underline; }

    .history-original {
      color: #475569;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .history-clicks {
      font-size: 0.78rem;
      color: #64748b;
      white-space: nowrap;
    }

    .history-clicks span { color: #94a3b8; font-weight: 600; }

    .empty-history {
      color: #334155;
      font-size: 0.88rem;
      text-align: center;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🔗</div>
      <h1>URL Shortener</h1>
    </div>
    <p class="subtitle">Paste a long URL and get a clean, shareable short link.</p>

    <div class="input-group">
      <input type="url" id="urlInput" placeholder="https://example.com/very/long/url..." autocomplete="off" />
      <button class="shorten-btn" id="shortenBtn" onclick="shortenUrl()">Shorten</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result-box" id="resultBox">
      <div class="result-label">Your short link</div>
      <div class="result-row">
        <a class="short-url" id="shortUrlLink" href="#" target="_blank"></a>
        <button class="copy-btn" id="copyBtn" onclick="copyUrl()">Copy</button>
      </div>
      <div class="stats-row">
        <div class="stat">Clicks: <span id="clickCount">0</span></div>
        <div class="stat">Created: <span id="createdAt">—</span></div>
      </div>
    </div>

    <div class="history-section" id="historySection" style="display:none">
      <div class="history-title">Recent Links</div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script>
    const history = [];

    async function shortenUrl() {
      const input = document.getElementById('urlInput');
      const btn = document.getElementById('shortenBtn');
      const errorMsg = document.getElementById('errorMsg');
      const resultBox = document.getElementById('resultBox');
      const url = input.value.trim();

      errorMsg.style.display = 'none';
      resultBox.style.display = 'none';

      if (!url) {
        showError('Please enter a URL.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Shortening…';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Something went wrong.');
          return;
        }

        // Show result
        const linkEl = document.getElementById('shortUrlLink');
        linkEl.href = data.shortUrl;
        linkEl.textContent = data.shortUrl;
        document.getElementById('clickCount').textContent = '0';
        document.getElementById('createdAt').textContent = new Date().toLocaleDateString();
        resultBox.style.display = 'block';

        // Reset copy button
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('copied');

        // Store in history
        history.unshift({ shortUrl: data.shortUrl, originalUrl: url, clicks: 0, code: data.shortCode });
        renderHistory();

        input.value = '';
      } catch (e) {
        showError('Network error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function copyUrl() {
      const url = document.getElementById('shortUrlLink').textContent;
      try {
        await navigator.clipboard.writeText(url);
      } catch {
        // Fallback for non-HTTPS
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    }

    function renderHistory() {
      const section = document.getElementById('historySection');
      const list = document.getElementById('historyList');

      if (history.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      list.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="history-item-info">
            <a class="history-short" href="${item.shortUrl}" target="_blank">${item.shortUrl}</a>
            <div class="history-original" title="${item.originalUrl}">${item.originalUrl}</div>
          </div>
          <div class="history-clicks">Clicks: <span>${item.clicks}</span></div>
        </div>
      `).join('');
    }

    // Allow Enter key to trigger shorten
    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') shortenUrl();
    });
  </script>
</body>
</html>
