<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>URL Shortener</h1>
      <p class="subtitle">Turn long URLs into short, shareable links</p>

      <div class="form-group">
        <input
          type="url"
          id="urlInput"
          placeholder="Enter your long URL here (e.g., https://example.com/very/long/path)"
          class="input"
        />
        <button id="shortenBtn" class="btn">Shorten URL</button>
      </div>

      <div id="result" class="result" style="display: none;">
        <div class="result-content">
          <p class="result-label">Your short URL:</p>
          <div class="result-url">
            <a id="shortUrlLink" href="#" target="_blank" class="short-url-link">Loading...</a>
            <button id="copyBtn" class="btn-copy">Copy</button>
          </div>
          <p class="original-url">Original: <span id="originalUrl"></span></p>
        </div>
      </div>

      <div id="error" class="error" style="display: none;"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
