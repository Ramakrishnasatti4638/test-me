<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔗 URL Shortener</h1>
      <p>Create short, shareable links in seconds</p>
    </header>

    <main>
      <section class="shortener-section">
        <div class="input-group">
          <input
            type="url"
            id="urlInput"
            placeholder="Enter your long URL here..."
            required
          >
          <button id="shortenBtn">Shorten</button>
        </div>
        <div id="error" class="error-message"></div>
      </section>

      <section id="resultSection" class="result-section hidden">
        <div class="result-box">
          <div class="result-item">
            <label>Short URL:</label>
            <div class="result-row">
              <input type="text" id="shortUrlOutput" readonly>
              <button id="copyBtn" class="copy-btn">Copy</button>
            </div>
          </div>
          <div class="result-item">
            <label>Original URL:</label>
            <input type="text" id="originalUrlOutput" readonly>
          </div>
          <div class="result-item">
            <label>Click Count:</label>
            <input type="text" id="clicksOutput" readonly>
          </div>
        </div>
      </section>

      <section class="stats-section">
        <h2>📊 Recent URLs</h2>
        <div id="urlsList" class="urls-list">
          <p class="empty-state">No URLs yet. Create one to get started!</p>
        </div>
      </section>
    </main>

    <footer>
      <p>Built with ❤️ | Share your links faster</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
