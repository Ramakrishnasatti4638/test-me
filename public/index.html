<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    input[type="url"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      display: none;
    }

    .result.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-label {
      color: #666;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .result-content {
      margin-bottom: 15px;
    }

    .result-url {
      padding: 12px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      word-break: break-all;
      font-size: 14px;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .copy-btn {
      padding: 8px 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: #764ba2;
    }

    .copy-btn.copied {
      background: #4caf50;
    }

    .error {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 10px;
      padding: 12px;
      background: #ffebee;
      border-radius: 6px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .history {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #e0e0e0;
    }

    .history h2 {
      color: #333;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .history-list {
      list-style: none;
    }

    .history-item {
      padding: 12px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #666;
    }

    .history-item-short {
      color: #667eea;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .history-item-original {
      word-break: break-all;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 URL Shortener</h1>

    <form id="shortenForm">
      <div class="form-group">
        <label for="urlInput">Enter URL to shorten:</label>
        <input
          type="url"
          id="urlInput"
          placeholder="https://example.com/very/long/url"
          required
        />
      </div>
      <button type="submit">Shorten URL</button>
    </form>

    <div class="error" id="error"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Shortening URL...</p>
    </div>

    <div class="result" id="result">
      <div class="result-content">
        <div class="result-label">Original URL</div>
        <div class="result-url">
          <span id="originalUrlDisplay"></span>
        </div>
      </div>
      <div class="result-content">
        <div class="result-label">Short URL</div>
        <div class="result-url">
          <span id="shortUrlDisplay"></span>
          <button type="button" class="copy-btn" id="copyBtn">Copy</button>
        </div>
      </div>
    </div>

    <div class="history" id="history" style="display: none;">
      <h2>Recent URLs</h2>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <script>
    const form = document.getElementById('shortenForm');
    const urlInput = document.getElementById('urlInput');
    const errorDiv = document.getElementById('error');
    const loadingDiv = document.getElementById('loading');
    const resultDiv = document.getElementById('result');
    const historyDiv = document.getElementById('history');
    const historyList = document.getElementById('historyList');
    const copyBtn = document.getElementById('copyBtn');

    let urlHistory = [];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();

      if (!url) {
        showError('Please enter a URL');
        return;
      }

      await shortenUrl(url);
    });

    async function shortenUrl(url) {
      errorDiv.classList.remove('show');
      resultDiv.classList.remove('show');
      loadingDiv.classList.add('show');

      try {
        const response = await fetch('/api/shorten', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ url })
        });

        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.error || 'Failed to shorten URL');
        }

        const data = await response.json();
        displayResult(data);
        addToHistory(data);
        urlInput.value = '';
      } catch (error) {
        showError(error.message);
      } finally {
        loadingDiv.classList.remove('show');
      }
    }

    function displayResult(data) {
      document.getElementById('originalUrlDisplay').textContent = data.originalUrl;
      document.getElementById('shortUrlDisplay').textContent = data.shortUrl;
      resultDiv.classList.add('show');

      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    }

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
    }

    function addToHistory(data) {
      urlHistory.unshift(data);
      if (urlHistory.length > 5) {
        urlHistory.pop();
      }
      updateHistoryDisplay();
    }

    function updateHistoryDisplay() {
      if (urlHistory.length === 0) {
        historyDiv.style.display = 'none';
        return;
      }

      historyDiv.style.display = 'block';
      historyList.innerHTML = urlHistory.map((item, index) => `
        <li class="history-item">
          <div class="history-item-short">${item.shortUrl}</div>
          <div class="history-item-original">${item.originalUrl}</div>
        </li>
      `).join('');
    }

    copyBtn.addEventListener('click', async () => {
      const shortUrl = document.getElementById('shortUrlDisplay').textContent;
      try {
        await navigator.clipboard.writeText(shortUrl);
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        showError('Failed to copy to clipboard');
      }
    });
  </script>
</body>
</html>
