<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snip — URL Shortener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <span>Snip</span>
      </div>
      <p class="tagline">Shorten. Share. Track.</p>
    </header>

    <!-- Hero / Input Section -->
    <main class="main">
      <div class="card shorten-card">
        <h1 class="card-title">Shorten your URL</h1>
        <p class="card-subtitle">Paste a long link and get a clean, shareable short URL instantly.</p>

        <div id="error-banner" class="banner banner--error" hidden></div>
        <div id="success-banner" class="banner banner--success" hidden></div>

        <form id="shorten-form" class="shorten-form">
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            <input
              type="text"
              id="url-input"
              class="url-input"
              placeholder="https://example.com/very/long/url..."
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <button type="submit" class="btn btn--primary" id="submit-btn">
            <span class="btn-text">Shorten URL</span>
            <svg class="btn-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" hidden>
              <path d="M21 12a9 9 0 1 1-6.22-8.56"/>
            </svg>
          </button>
        </form>

        <!-- Result Box -->
        <div id="result-box" class="result-box" hidden>
          <div class="result-label">Your short URL</div>
          <div class="result-row">
            <a id="result-link" class="result-link" href="#" target="_blank" rel="noopener noreferrer"></a>
            <button id="copy-btn" class="btn btn--ghost copy-btn" title="Copy to clipboard">
              <svg id="copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <svg id="check-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" hidden>
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              <span id="copy-text">Copy</span>
            </button>
          </div>
          <div class="result-original" id="result-original"></div>
        </div>
      </div>

      <!-- History Table -->
      <div class="card history-card" id="history-card" hidden>
        <div class="history-header">
          <h2 class="card-title">Recent URLs</h2>
          <button id="clear-btn" class="btn btn--danger-ghost">Clear all</button>
        </div>
        <div class="table-wrapper">
          <table class="url-table">
            <thead>
              <tr>
                <th>Short URL</th>
                <th>Original URL</th>
                <th>Clicks</th>
                <th>Created</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="url-table-body"></tbody>
          </table>
        </div>
      </div>
    </main>

    <footer class="footer">
      Built with ❤️ — links are stored in memory and reset on server restart.
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
