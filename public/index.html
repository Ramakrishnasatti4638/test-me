<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 1rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    input[type="url"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1.5px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: #6366f1;
    }

    input[type="url"]::placeholder { color: #475569; }

    button {
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .error {
      margin-top: 12px;
      color: #f87171;
      font-size: 0.875rem;
    }

    .result-box {
      margin-top: 20px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 10px;
      padding: 16px;
      display: none;
    }

    .result-box label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 8px;
    }

    .result-link-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .result-link-row a {
      flex: 1;
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      word-break: break-all;
      font-size: 1rem;
    }

    .result-link-row a:hover { text-decoration: underline; }

    .copy-btn {
      padding: 6px 14px;
      font-size: 0.8rem;
      background: #334155;
      border-radius: 7px;
      flex-shrink: 0;
    }

    .copy-btn:hover { background: #475569; opacity: 1; }

    .divider {
      border: none;
      border-top: 1px solid #334155;
      margin: 28px 0;
    }

    .history-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 14px;
    }

    .url-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
    }

    .url-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .url-item-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .url-item-info {
      flex: 1;
      min-width: 0;
    }

    .url-item-info a {
      display: block;
      color: #818cf8;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .url-item-info a:hover { text-decoration: underline; }

    .url-item-info span {
      display: block;
      color: #64748b;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      color: #475569;
      font-size: 0.9rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>✂ URL Shortener</h1>
    <p>Paste a long URL and get a short, shareable link instantly.</p>
  </header>

  <div class="card">
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="https://example.com/very/long/url..." />
      <button id="shortenBtn" onclick="shortenUrl()">Shorten</button>
    </div>
    <p class="error" id="errorMsg"></p>

    <div class="result-box" id="resultBox">
      <label>Your shortened URL</label>
      <div class="result-link-row">
        <a id="resultLink" href="#" target="_blank" rel="noopener noreferrer"></a>
        <button class="copy-btn" onclick="copyLink()">Copy</button>
      </div>
    </div>

    <hr class="divider" />

    <p class="history-title">Recent Links</p>
    <ul class="url-list" id="urlList">
      <li class="empty-state" id="emptyState">No links shortened yet.</li>
    </ul>
  </div>

  <script>
    async function shortenUrl() {
      const input = document.getElementById('urlInput');
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('shortenBtn');

      errorMsg.textContent = '';
      const url = input.value.trim();

      if (!url) {
        errorMsg.textContent = 'Please enter a URL.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Shortening…';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Something went wrong.';
          return;
        }

        showResult(data.shortUrl);
        loadHistory();
        input.value = '';
      } catch (err) {
        errorMsg.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten';
      }
    }

    function showResult(shortUrl) {
      const box = document.getElementById('resultBox');
      const link = document.getElementById('resultLink');
      box.style.display = 'block';
      link.href = shortUrl;
      link.textContent = shortUrl;
    }

    function copyLink() {
      const link = document.getElementById('resultLink').href;
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => (btn.textContent = 'Copy'), 2000);
      });
    }

    async function loadHistory() {
      const list = document.getElementById('urlList');
      const emptyState = document.getElementById('emptyState');

      try {
        const res = await fetch('/api/urls');
        const urls = await res.json();

        if (urls.length === 0) {
          list.innerHTML = '<li class="empty-state" id="emptyState">No links shortened yet.</li>';
          return;
        }

        list.innerHTML = urls
          .slice()
          .reverse()
          .map(
            ({ shortCode, originalUrl }) => `
            <li class="url-item">
              <div class="url-item-icon">🔗</div>
              <div class="url-item-info">
                <a href="/${shortCode}" target="_blank" rel="noopener noreferrer">
                  ${location.origin}/${shortCode}
                </a>
                <span title="${originalUrl}">${originalUrl}</span>
              </div>
            </li>`
          )
          .join('');
      } catch (err) {
        console.error('Failed to load history', err);
      }
    }

    // Allow Enter key to trigger shorten
    document.getElementById('urlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') shortenUrl();
    });

    loadHistory();
  </script>
</body>
</html>
