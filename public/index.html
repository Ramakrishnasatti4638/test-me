<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 32px;
      font-size: 14px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      transition: border-color 0.2s;
      outline: none;
      color: #1a1a2e;
    }

    input[type="url"]:focus { border-color: #667eea; }

    button {
      padding: 14px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .result-box {
      display: none;
      margin-top: 20px;
      background: #f0f4ff;
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      padding: 16px 20px;
      align-items: center;
      gap: 12px;
    }

    .result-box.show { display: flex; }

    .result-link {
      flex: 1;
      color: #4f46e5;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      word-break: break-all;
    }

    .result-link:hover { text-decoration: underline; }

    .copy-btn {
      padding: 8px 16px;
      font-size: 13px;
      border-radius: 8px;
      background: #4f46e5;
      flex-shrink: 0;
    }

    .error-msg {
      display: none;
      margin-top: 12px;
      color: #dc2626;
      font-size: 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .error-msg.show { display: block; }

    .divider {
      border: none;
      border-top: 1px solid #f3f4f6;
      margin: 32px 0 24px;
    }

    .history-title {
      font-size: 16px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 14px;
    }

    .history-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    .history-item {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-item .short {
      color: #4f46e5;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      min-width: 90px;
    }

    .history-item .short:hover { text-decoration: underline; }

    .arrow { color: #9ca3af; font-size: 14px; }

    .history-item .original {
      color: #6b7280;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .empty-state {
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🔗</div>
      <h1>URL Shortener</h1>
    </div>
    <p class="subtitle">Paste a long URL and get a short, shareable link instantly.</p>

    <div class="input-row">
      <input type="url" id="urlInput" placeholder="https://example.com/very/long/url..." />
      <button id="shortenBtn" onclick="shortenUrl()">Shorten</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result-box" id="resultBox">
      <a class="result-link" id="resultLink" href="#"></a>
      <button class="copy-btn" onclick="copyLink()">Copy</button>
    </div>

    <hr class="divider" />

    <p class="history-title">Recent Links</p>
    <ul class="history-list" id="historyList">
      <li class="empty-state" id="emptyState">No links yet. Shorten your first URL above!</li>
    </ul>
  </div>

  <script>
    async function shortenUrl() {
      const input = document.getElementById('urlInput');
      const btn = document.getElementById('shortenBtn');
      const errorMsg = document.getElementById('errorMsg');
      const resultBox = document.getElementById('resultBox');

      const url = input.value.trim();

      errorMsg.classList.remove('show');
      resultBox.classList.remove('show');

      if (!url) {
        showError('Please enter a URL.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Shortening…';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Something went wrong.');
          return;
        }

        const fullShortUrl = `${window.location.origin}${data.shortUrl}`;
        const linkEl = document.getElementById('resultLink');
        linkEl.href = fullShortUrl;
        linkEl.textContent = fullShortUrl;
        resultBox.classList.add('show');

        input.value = '';
        loadHistory();
      } catch {
        showError('Network error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
    }

    function copyLink() {
      const link = document.getElementById('resultLink').textContent;
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
      });
    }

    async function loadHistory() {
      const res = await fetch('/api/urls');
      const urls = await res.json();
      const list = document.getElementById('historyList');
      const empty = document.getElementById('emptyState');

      list.innerHTML = '';

      if (urls.length === 0) {
        list.appendChild(empty);
        return;
      }

      [...urls].reverse().slice(0, 8).forEach(({ shortUrl, originalUrl }) => {
        const fullShort = `${window.location.origin}${shortUrl}`;
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <a class="short" href="${shortUrl}" target="_blank">${fullShort}</a>
          <span class="arrow">→</span>
          <span class="original" title="${originalUrl}">${originalUrl}</span>
        `;
        list.appendChild(li);
      });
    }

    // Allow Enter key to trigger shorten
    document.getElementById('urlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') shortenUrl();
    });

    loadHistory();
  </script>
</body>
</html>
