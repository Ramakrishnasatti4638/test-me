<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 16px 40px;
      font-family: 'Segoe UI', sans-serif;
      color: #e8e8f0;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      margin-top: 8px;
      color: #a0a0c0;
      font-size: 1rem;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      backdrop-filter: blur(8px);
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #e8e8f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input::placeholder { color: #707090; }

    .input-row input:focus { border-color: #a78bfa; }

    .input-row button {
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover { opacity: 0.85; }

    #error-msg {
      margin-top: 10px;
      color: #f87171;
      font-size: 0.88rem;
      min-height: 20px;
    }

    #result-box {
      display: none;
      margin-top: 20px;
      padding: 14px 18px;
      background: rgba(96,165,250,0.1);
      border: 1px solid rgba(96,165,250,0.3);
      border-radius: 10px;
    }

    #result-box p { font-size: 0.88rem; color: #a0a0c0; margin-bottom: 6px; }

    #result-link-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #short-url-display {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
      color: #a78bfa;
      word-break: break-all;
      text-decoration: none;
    }

    #short-url-display:hover { text-decoration: underline; }

    #copy-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(167,139,250,0.4);
      background: transparent;
      color: #a78bfa;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #copy-btn:hover { background: rgba(167,139,250,0.15); }

    .history-section {
      width: 100%;
      max-width: 560px;
      margin-top: 36px;
    }

    .history-section h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #a0a0c0;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #url-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    .url-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .url-item-text { flex: 1; min-width: 0; }

    .url-item-short a {
      font-size: 0.95rem;
      font-weight: 700;
      color: #60a5fa;
      text-decoration: none;
    }

    .url-item-short a:hover { text-decoration: underline; }

    .url-item-original {
      font-size: 0.8rem;
      color: #707090;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    .delete-btn {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid rgba(248,113,113,0.35);
      color: #f87171;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .delete-btn:hover { background: rgba(248,113,113,0.12); }

    #empty-state {
      text-align: center;
      color: #505070;
      font-size: 0.9rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ URL Shortener</h1>
    <p>Paste a long URL, get a short one instantly</p>
  </header>

  <div class="card">
    <div class="input-row">
      <input type="url" id="url-input" placeholder="https://example.com/very/long/url..." />
      <button id="shorten-btn">Shorten</button>
    </div>
    <p id="error-msg"></p>

    <div id="result-box">
      <p>Your short link is ready:</p>
      <div id="result-link-row">
        <a id="short-url-display" href="#"></a>
        <button id="copy-btn">Copy</button>
      </div>
    </div>
  </div>

  <section class="history-section">
    <h2>Recent Links</h2>
    <ul id="url-list">
      <li id="empty-state">No links yet — shorten one above!</li>
    </ul>
  </section>

  <script>
    const input     = document.getElementById('url-input');
    const btn       = document.getElementById('shorten-btn');
    const errorMsg  = document.getElementById('error-msg');
    const resultBox = document.getElementById('result-box');
    const shortLink = document.getElementById('short-url-display');
    const copyBtn   = document.getElementById('copy-btn');
    const urlList   = document.getElementById('url-list');

    function setError(msg) { errorMsg.textContent = msg; }
    function clearError()  { errorMsg.textContent = ''; }

    async function shorten() {
      clearError();
      const url = input.value.trim();
      if (!url) { setError('Please enter a URL.'); return; }

      try {
        const res  = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) { setError(data.error || 'Something went wrong.'); return; }

        const full = window.location.origin + data.shortUrl;
        shortLink.href = data.shortUrl;
        shortLink.textContent = full;
        resultBox.style.display = 'block';
        input.value = '';

        loadHistory();
      } catch {
        setError('Network error — please try again.');
      }
    }

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortLink.textContent).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
      });
    });

    btn.addEventListener('click', shorten);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') shorten(); });

    async function loadHistory() {
      const res  = await fetch('/api/urls');
      const list = await res.json();

      urlList.innerHTML = '';

      if (list.length === 0) {
        urlList.innerHTML = '<li id="empty-state">No links yet — shorten one above!</li>';
        return;
      }

      list.slice().reverse().forEach(({ shortCode, shortUrl, originalUrl }) => {
        const full = window.location.origin + shortUrl;
        const li = document.createElement('li');
        li.className = 'url-item';
        li.dataset.code = shortCode;
        li.innerHTML = `
          <div class="url-item-text">
            <div class="url-item-short"><a href="${shortUrl}" target="_blank" rel="noopener">${full}</a></div>
            <div class="url-item-original" title="${originalUrl}">${originalUrl}</div>
          </div>
          <button class="delete-btn" data-code="${shortCode}">Delete</button>
        `;
        urlList.appendChild(li);
      });

      document.querySelectorAll('.delete-btn').forEach(b => {
        b.addEventListener('click', async () => {
          const code = b.dataset.code;
          await fetch(`/api/urls/${code}`, { method: 'DELETE' });
          loadHistory();
        });
      });
    }

    loadHistory();
  </script>
</body>
</html>
