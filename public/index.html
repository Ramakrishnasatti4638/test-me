<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>🔗 URL Shortener</h1>
      <p class="subtitle">Make your long URLs shorter and shareable</p>

      <div class="form-section">
        <input
          type="url"
          id="urlInput"
          placeholder="Enter your long URL here..."
          class="url-input"
        />
        <button id="shortenBtn" class="btn-primary">Shorten URL</button>
      </div>

      <div id="result" class="result hidden">
        <div class="result-box">
          <p class="result-label">Your shortened URL:</p>
          <div class="result-url">
            <input type="text" id="shortUrl" readonly class="result-input" />
            <button id="copyBtn" class="btn-copy">📋 Copy</button>
          </div>
          <p class="result-label" style="margin-top: 15px;">Original URL:</p>
          <p id="originalUrl" class="original-url"></p>
        </div>
      </div>

      <div class="history-section">
        <h2>Recently Shortened</h2>
        <div id="urlList" class="url-list">
          <p class="empty-state">No URLs shortened yet</p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
