<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snip — URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #23232f;
      --border: #2e2e3e;
      --accent: #7c5cfc;
      --accent-hover: #9b7fff;
      --accent-dim: rgba(124,92,252,.15);
      --text: #e8e8f0;
      --text-muted: #7a7a96;
      --danger: #f04f5e;
      --success: #2dcc88;
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
    }

    header { text-align: center; margin-bottom: 40px; }
    header h1 {
      font-size: 2.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #7c5cfc, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }
    header p { color: var(--text-muted); margin-top: 8px; font-size: .95rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      width: 100%;
      max-width: 600px;
    }

    .input-group { display: flex; flex-direction: column; gap: 12px; }

    label { font-size: .83rem; font-weight: 600; color: var(--text-muted); letter-spacing: .04em; text-transform: uppercase; }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--text-muted); }

    .row { display: flex; gap: 12px; align-items: flex-end; }
    .row .field { flex: 1; display: flex; flex-direction: column; gap: 6px; }

    button {
      padding: 12px 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
      white-space: nowrap;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(.97); }

    .error-msg {
      font-size: .87rem;
      color: var(--danger);
      min-height: 20px;
    }

    /* Result box */
    #result {
      display: none;
      margin-top: 20px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 16px 20px;
      align-items: center;
      gap: 12px;
    }
    #result.show { display: flex; }
    #result .short-url {
      flex: 1;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent-hover);
      word-break: break-all;
    }
    #result .short-url a { color: inherit; text-decoration: none; }
    #result .short-url a:hover { text-decoration: underline; }

    .copy-btn {
      padding: 8px 16px;
      font-size: .85rem;
      background: var(--accent);
      border-radius: 6px;
    }
    .copy-btn.copied { background: var(--success); }

    /* History table */
    #history-section { width: 100%; max-width: 600px; margin-top: 36px; }
    #history-section h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      font-size: .9rem;
    }
    thead { background: var(--surface2); }
    th {
      padding: 11px 14px;
      text-align: left;
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      color: var(--text);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .td-short a { color: var(--accent-hover); text-decoration: none; font-weight: 600; }
    .td-short a:hover { text-decoration: underline; }
    .td-long { color: var(--text-muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .td-clicks { font-weight: 700; color: var(--success); text-align: center; }
    .td-del {
      text-align: center;
    }
    .del-btn {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 5px 10px;
      font-size: .78rem;
      border-radius: 6px;
    }
    .del-btn:hover { background: var(--danger); color: #fff; }

    .empty-state {
      text-align: center;
      padding: 32px;
      color: var(--text-muted);
      font-size: .92rem;
    }

    @media (max-width: 480px) {
      .card { padding: 20px 16px; }
      .row { flex-direction: column; }
      header h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>✂ Snip</h1>
    <p>Paste a long URL, get a short one instantly.</p>
  </header>

  <div class="card">
    <div class="input-group">
      <div class="field">
        <label for="longUrl">Long URL</label>
        <input type="text" id="longUrl" placeholder="https://example.com/very/long/url" />
      </div>

      <div class="row">
        <div class="field">
          <label for="customCode">Custom Code <span style="font-weight:400;text-transform:none">(optional)</span></label>
          <input type="text" id="customCode" placeholder="e.g. my-link" maxlength="20" />
        </div>
        <button id="shortenBtn" onclick="shorten()">Shorten →</button>
      </div>

      <p class="error-msg" id="errorMsg"></p>
    </div>

    <div id="result">
      <div class="short-url"><a id="shortLink" href="#" target="_blank"></a></div>
      <button class="copy-btn" id="copyBtn" onclick="copyLink()">Copy</button>
    </div>
  </div>

  <section id="history-section">
    <h2>Recent Links</h2>
    <div id="tableContainer"></div>
  </section>

  <script>
    const base = window.location.origin;

    async function shorten() {
      const url = document.getElementById('longUrl').value.trim();
      const customCode = document.getElementById('customCode').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      if (!url) { errorMsg.textContent = 'Please enter a URL.'; return; }

      const btn = document.getElementById('shortenBtn');
      btn.disabled = true;
      btn.textContent = 'Shortening…';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, customCode: customCode || undefined })
        });
        const data = await res.json();

        if (!res.ok) { errorMsg.textContent = data.error; return; }

        const fullShort = `${base}${data.shortUrl}`;
        const link = document.getElementById('shortLink');
        link.textContent = fullShort;
        link.href = fullShort;

        const result = document.getElementById('result');
        result.classList.add('show');

        document.getElementById('copyBtn').textContent = 'Copy';
        document.getElementById('copyBtn').classList.remove('copied');

        document.getElementById('longUrl').value = '';
        document.getElementById('customCode').value = '';

        loadHistory();
      } catch {
        errorMsg.textContent = 'Something went wrong. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten →';
      }
    }

    async function copyLink() {
      const link = document.getElementById('shortLink').href;
      await navigator.clipboard.writeText(link);
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    }

    async function loadHistory() {
      const res = await fetch('/api/urls');
      const list = await res.json();
      const container = document.getElementById('tableContainer');

      if (!list.length) {
        container.innerHTML = '<div class="empty-state">No links yet — shorten your first URL above!</div>';
        return;
      }

      const rows = list.map(item => `
        <tr>
          <td class="td-short"><a href="/s/${item.code}" target="_blank">/s/${item.code}</a></td>
          <td class="td-long" title="${item.url}">${item.url}</td>
          <td class="td-clicks">${item.clicks}</td>
          <td class="td-del"><button class="del-btn" onclick="deleteUrl('${item.code}')">Delete</button></td>
        </tr>
      `).join('');

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Short Link</th>
              <th>Original URL</th>
              <th style="text-align:center">Clicks</th>
              <th style="text-align:center">Action</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    async function deleteUrl(code) {
      if (!confirm(`Delete /s/${code}?`)) return;
      await fetch(`/api/urls/${code}`, { method: 'DELETE' });
      loadHistory();
    }

    // Allow Enter key to trigger shorten
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') shorten();
    });

    loadHistory();
  </script>
</body>
</html>
