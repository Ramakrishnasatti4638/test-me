<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔗 URL Shortener</h1>
      <p class="subtitle">Make your URLs shorter and shareable</p>
    </header>

    <main>
      <section class="shorten-section">
        <div class="form-container">
          <input
            type="url"
            id="urlInput"
            placeholder="Enter your long URL here..."
            class="url-input"
          />
          <button id="shortenBtn" class="btn btn-primary">Shorten URL</button>
        </div>

        <div id="result" class="result hidden">
          <div class="result-content">
            <div class="result-item">
              <label>Original URL:</label>
              <div class="url-display" id="originalUrl"></div>
            </div>
            <div class="result-item">
              <label>Shortened URL:</label>
              <div class="url-display clickable" id="shortenedUrl"></div>
            </div>
            <button id="copyBtn" class="btn btn-secondary">Copy Short URL</button>
          </div>
        </div>

        <div id="errorMsg" class="error hidden"></div>
      </section>

      <section class="history-section">
        <h2>Recent URLs</h2>
        <div id="urlList" class="url-list">
          <p class="placeholder">No URLs shortened yet</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
