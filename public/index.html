<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapURL — URL Shortener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span>SnapURL</span>
    </div>
    <p class="tagline">Shorten, share, and track your links in seconds</p>
  </header>

  <!-- Main Card -->
  <main>
    <section class="card shorten-card">
      <h2>Shorten a URL</h2>
      <form id="shortenForm">
        <div class="input-group">
          <label for="urlInput">Long URL</label>
          <input
            type="url"
            id="urlInput"
            placeholder="https://example.com/very/long/url"
            required
            autocomplete="off"
          />
        </div>
        <div class="input-group">
          <label for="slugInput">Custom alias <span class="optional">(optional)</span></label>
          <div class="slug-wrapper">
            <span class="slug-prefix" id="slugPrefix">localhost/</span>
            <input
              type="text"
              id="slugInput"
              placeholder="my-link"
              pattern="[a-zA-Z0-9_\-]+"
              autocomplete="off"
            />
          </div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          Shorten URL
        </button>
      </form>

      <!-- Result box -->
      <div class="result-box hidden" id="resultBox">
        <div class="result-header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Your short link is ready!</span>
        </div>
        <div class="result-link-row">
          <a id="resultLink" href="#" target="_blank" rel="noopener noreferrer"></a>
          <button class="btn-copy" id="copyBtn" title="Copy to clipboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Copy
          </button>
        </div>
        <p class="result-original">→ <span id="resultOriginal"></span></p>
      </div>

      <!-- Error box -->
      <div class="error-box hidden" id="errorBox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorMsg"></span>
      </div>
    </section>

    <!-- Stats Table -->
    <section class="card stats-card">
      <div class="stats-header">
        <h2>Your Links</h2>
        <button class="btn-refresh" id="refreshBtn" title="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          Refresh
        </button>
      </div>
      <div class="table-wrapper">
        <table id="statsTable">
          <thead>
            <tr>
              <th>Short URL</th>
              <th>Original URL</th>
              <th>Clicks</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="statsBody">
            <tr class="empty-row">
              <td colspan="5">No links yet. Create your first short URL above!</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>Built with ❤️ using Node.js &amp; Express</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
