<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">

    <!-- Hero / Form -->
    <header class="hero">
      <div class="hero-inner">
        <div class="logo">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="36" rx="10" fill="#6366f1"/>
            <path d="M10 18h16M20 12l6 6-6 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Snip<strong>ly</strong></span>
        </div>
        <h1>Shorten any URL instantly</h1>
        <p class="sub">Paste a long link below and get a compact, shareable short URL.</p>

        <form id="shorten-form" class="form-card">
          <div class="input-row">
            <input
              id="url-input"
              type="url"
              placeholder="https://example.com/very/long/url..."
              autocomplete="off"
              spellcheck="false"
              required
            />
            <button type="submit" id="submit-btn">
              <span class="btn-text">Shorten</span>
              <span class="btn-spinner" hidden>
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="rgba(255,255,255,.4)" stroke-width="2.5"/><path d="M9 2a7 7 0 0 1 7 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
              </span>
            </button>
          </div>
          <div id="form-error" class="form-error" hidden></div>
        </form>

        <!-- Result card -->
        <div id="result-card" class="result-card" hidden>
          <div class="result-label">Your short URL</div>
          <div class="result-row">
            <a id="result-link" href="#" target="_blank" rel="noopener noreferrer"></a>
            <button id="copy-btn" class="copy-btn" title="Copy to clipboard">
              <svg id="copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <svg id="check-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" hidden>
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </button>
          </div>
          <div class="result-original">
            <span class="label-muted">Original:</span>
            <span id="result-original-url" class="original-url"></span>
          </div>
        </div>
      </div>
    </header>

    <!-- URL list -->
    <main class="main">
      <div class="section-header">
        <h2>Recent links</h2>
        <span id="url-count" class="badge">0</span>
      </div>

      <div id="url-list" class="url-list">
        <div class="empty-state" id="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <p>No links yet. Shorten your first URL above!</p>
        </div>
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
