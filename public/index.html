<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 6px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-label {
      color: #666;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .result-value {
      background: white;
      padding: 12px;
      border-radius: 4px;
      color: #333;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      word-break: break-all;
      margin-bottom: 10px;
    }

    .copy-btn {
      width: 100%;
      padding: 8px;
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #667eea;
      color: white;
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 6px;
      margin-top: 20px;
      display: none;
      font-size: 14px;
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      margin-top: 10px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Paste your long URL below to create a short link</p>

    <div class="input-group">
      <label for="urlInput">Enter URL</label>
      <input 
        type="text" 
        id="urlInput" 
        placeholder="https://example.com/very/long/url/path"
      >
    </div>

    <button id="shortenBtn">Shorten URL</button>

    <div class="loading" id="loading">
      <div class="spinner"></div> Creating short URL...
    </div>

    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div class="result-label">Short URL</div>
      <div class="result-value" id="shortUrl"></div>
      <button class="copy-btn" id="copyBtn">📋 Copy Short URL</button>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const shortenBtn = document.getElementById('shortenBtn');
    const resultDiv = document.getElementById('result');
    const shortUrlDiv = document.getElementById('shortUrl');
    const copyBtn = document.getElementById('copyBtn');
    const errorDiv = document.getElementById('error');
    const loadingDiv = document.getElementById('loading');

    shortenBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();

      if (!url) {
        showError('Please enter a URL');
        return;
      }

      try {
        loadingDiv.classList.add('show');
        errorDiv.classList.remove('show');

        const response = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Failed to shorten URL');
          loadingDiv.classList.remove('show');
          return;
        }

        shortUrlDiv.textContent = data.shortUrl;
        resultDiv.classList.add('show');
        loadingDiv.classList.remove('show');
      } catch (error) {
        showError('An error occurred. Please try again.');
        loadingDiv.classList.remove('show');
      }
    });

    copyBtn.addEventListener('click', () => {
      const shortUrl = shortUrlDiv.textContent;
      navigator.clipboard.writeText(shortUrl).then(() => {
        copyBtn.textContent = '✓ Copied!';
        setTimeout(() => {
          copyBtn.textContent = '📋 Copy Short URL';
        }, 2000);
      });
    });

    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        shortenBtn.click();
      }
    });

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
    }
  </script>
</body>
</html>
