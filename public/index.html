<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #f0f0f0;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      margin-top: 0.5rem;
      color: #a0aec0;
      font-size: 1rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      backdrop-filter: blur(12px);
    }

    .input-row {
      display: flex;
      gap: 0.6rem;
    }

    .input-row input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input::placeholder { color: #718096; }
    .input-row input:focus { border-color: #a78bfa; }

    .input-row button {
      padding: 0.75rem 1.4rem;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .input-row button:hover { opacity: 0.88; }
    .input-row button:active { transform: scale(0.97); }

    #error-msg {
      margin-top: 0.6rem;
      color: #fc8181;
      font-size: 0.85rem;
      min-height: 1.1rem;
    }

    #result-box {
      margin-top: 1.4rem;
      display: none;
      background: rgba(167, 139, 250, 0.1);
      border: 1px solid rgba(167, 139, 250, 0.3);
      border-radius: 10px;
      padding: 1rem 1.2rem;
    }

    #result-box p { font-size: 0.85rem; color: #a0aec0; margin-bottom: 0.4rem; }

    .result-link-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    #short-url-link {
      flex: 1;
      color: #a78bfa;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      word-break: break-all;
    }

    #short-url-link:hover { text-decoration: underline; }

    #copy-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 7px;
      border: 1px solid rgba(167, 139, 250, 0.5);
      background: transparent;
      color: #a78bfa;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #copy-btn:hover { background: rgba(167, 139, 250, 0.15); }
    #copy-btn.copied { color: #68d391; border-color: #68d391; }

    .history {
      margin-top: 2rem;
      width: 100%;
      max-width: 560px;
    }

    .history h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #a0aec0;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .history-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .history-item .original {
      font-size: 0.82rem;
      color: #718096;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .history-item a {
      font-size: 0.88rem;
      color: #60a5fa;
      text-decoration: none;
      white-space: nowrap;
      font-weight: 500;
    }

    .history-item a:hover { text-decoration: underline; }

    .empty-state {
      text-align: center;
      color: #4a5568;
      font-size: 0.9rem;
      padding: 1rem 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ URL Shortener</h1>
    <p>Paste a long URL and get a short link instantly</p>
  </header>

  <div class="card">
    <div class="input-row">
      <input
        type="text"
        id="url-input"
        placeholder="https://example.com/very/long/url..."
        autocomplete="off"
      />
      <button id="shorten-btn">Shorten</button>
    </div>
    <div id="error-msg"></div>

    <div id="result-box">
      <p>Your short link is ready:</p>
      <div class="result-link-row">
        <a id="short-url-link" href="#" target="_blank" rel="noopener"></a>
        <button id="copy-btn">Copy</button>
      </div>
    </div>
  </div>

  <div class="history" id="history-section" style="display:none">
    <h2>Recent Links</h2>
    <div class="history-list" id="history-list"></div>
  </div>

  <script>
    const input     = document.getElementById('url-input');
    const btn       = document.getElementById('shorten-btn');
    const errorMsg  = document.getElementById('error-msg');
    const resultBox = document.getElementById('result-box');
    const shortLink = document.getElementById('short-url-link');
    const copyBtn   = document.getElementById('copy-btn');
    const histSec   = document.getElementById('history-section');
    const histList  = document.getElementById('history-list');

    const history = [];

    async function shorten() {
      errorMsg.textContent = '';
      const url = input.value.trim();
      if (!url) { errorMsg.textContent = 'Please enter a URL.'; return; }

      btn.disabled = true;
      btn.textContent = 'Shortening…';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) { errorMsg.textContent = data.error || 'Something went wrong.'; return; }

        shortLink.href      = data.shortUrl;
        shortLink.textContent = data.shortUrl;
        resultBox.style.display = 'block';
        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('copied');

        history.unshift({ original: url, short: data.shortUrl });
        renderHistory();
        input.value = '';
      } catch {
        errorMsg.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten';
      }
    }

    function renderHistory() {
      if (!history.length) { histSec.style.display = 'none'; return; }
      histSec.style.display = 'block';
      histList.innerHTML = history.map(h => `
        <div class="history-item">
          <span class="original" title="${h.original}">${h.original}</span>
          <a href="${h.short}" target="_blank" rel="noopener">${h.short}</a>
        </div>
      `).join('');
    }

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortLink.href).then(() => {
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 2000);
      });
    });

    btn.addEventListener('click', shorten);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') shorten(); });
  </script>

</body>
</html>
