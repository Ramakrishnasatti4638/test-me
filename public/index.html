<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #e94560, #0f3460);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    h1 span {
      color: #e94560;
    }

    .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 15px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input[type="url"]::placeholder { color: rgba(255,255,255,0.3); }
    input[type="url"]:focus {
      border-color: #e94560;
      background: rgba(255,255,255,0.12);
    }

    button {
      background: linear-gradient(135deg, #e94560, #c0392b);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    button:hover { transform: translateY(-1px); opacity: 0.9; }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .error {
      margin-top: 12px;
      padding: 12px 16px;
      background: rgba(233, 69, 96, 0.15);
      border: 1px solid rgba(233, 69, 96, 0.4);
      border-radius: 10px;
      color: #e94560;
      font-size: 14px;
      display: none;
    }

    .result-box {
      margin-top: 28px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 20px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-label {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .short-link-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .short-link {
      flex: 1;
      font-size: 18px;
      font-weight: 700;
      color: #e94560;
      text-decoration: none;
      word-break: break-all;
      transition: color 0.2s;
    }

    .short-link:hover { color: #ff6b84; text-decoration: underline; }

    .copy-btn {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .copy-btn:hover { background: rgba(255,255,255,0.18); transform: none; }

    .original-url {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      word-break: break-all;
    }

    .history {
      margin-top: 32px;
    }

    .history-title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 14px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeIn 0.25s ease;
    }

    .history-item a {
      font-size: 15px;
      font-weight: 600;
      color: #e94560;
      text-decoration: none;
    }

    .history-item a:hover { text-decoration: underline; }

    .history-item .orig {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🔗</div>
      <h1>Snip<span>URL</span></h1>
    </div>
    <p class="subtitle">Paste a long URL and get a short, shareable link instantly.</p>

    <label for="urlInput">Enter your URL</label>
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="https://example.com/very/long/url..." autocomplete="off" />
      <button id="shortenBtn">Shorten</button>
    </div>
    <div class="error" id="errorMsg"></div>

    <div class="result-box" id="resultBox">
      <div class="result-label">Your short link</div>
      <div class="short-link-row">
        <a class="short-link" id="shortLink" href="#"></a>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <div class="original-url" id="originalUrl"></div>
    </div>

    <div class="history" id="historySection" style="display:none">
      <div class="history-title">Recent links</div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script>
    const urlInput   = document.getElementById('urlInput');
    const shortenBtn = document.getElementById('shortenBtn');
    const errorMsg   = document.getElementById('errorMsg');
    const resultBox  = document.getElementById('resultBox');
    const shortLink  = document.getElementById('shortLink');
    const originalUrl = document.getElementById('originalUrl');
    const copyBtn    = document.getElementById('copyBtn');
    const historySection = document.getElementById('historySection');
    const historyList    = document.getElementById('historyList');

    const history = [];

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    function addHistoryItem(shortUrl, originalUrl) {
      history.unshift({ shortUrl, originalUrl });
      if (history.length > 5) history.pop();
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) { historySection.style.display = 'none'; return; }
      historySection.style.display = 'block';
      historyList.innerHTML = history.map(item => `
        <div class="history-item">
          <a href="${item.shortUrl}">${item.shortUrl}</a>
          <span class="orig" title="${item.originalUrl}">${item.originalUrl}</span>
        </div>
      `).join('');
    }

    shortenBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      hideError();

      if (!url) { showError('Please enter a URL.'); return; }

      shortenBtn.disabled = true;
      shortenBtn.textContent = 'Shortening…';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) { showError(data.error || 'Something went wrong.'); return; }

        const fullShort = window.location.origin + data.shortUrl;
        shortLink.href = fullShort;
        shortLink.textContent = fullShort;
        originalUrl.textContent = '→ ' + url;
        resultBox.style.display = 'block';

        addHistoryItem(fullShort, url);
        urlInput.value = '';
      } catch (err) {
        showError('Network error. Please try again.');
      } finally {
        shortenBtn.disabled = false;
        shortenBtn.textContent = 'Shorten';
      }
    });

    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') shortenBtn.click(); });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortLink.textContent).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => (copyBtn.textContent = 'Copy'), 1800);
      });
    });
  </script>
</body>
</html>
