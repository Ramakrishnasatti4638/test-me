<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip — URL Shortener</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1><span class="logo">🔗</span> Snip</h1>
        <p class="tagline">Turn long, unwieldy links into short, shareable ones.</p>
      </header>

      <form id="shorten-form" class="card" autocomplete="off">
        <label for="url-input" class="sr-only">URL to shorten</label>
        <div class="input-row">
          <input
            id="url-input"
            name="url"
            type="url"
            placeholder="https://example.com/very/long/link"
            required
          />
          <button type="submit" id="submit-btn">Shorten</button>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
      </form>

      <section class="card links-card">
        <h2>Your links</h2>
        <ul id="links" class="links"></ul>
        <p id="empty" class="empty">No links yet — shorten one above to get started.</p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
