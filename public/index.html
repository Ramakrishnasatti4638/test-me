<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f0f0f0;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      margin-bottom: 36px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: #7c3aed;
    }

    input[type="url"]::placeholder { color: rgba(255,255,255,0.35); }

    button.shorten-btn {
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
    }

    button.shorten-btn:hover { opacity: 0.9; }
    button.shorten-btn:active { transform: scale(0.97); }
    button.shorten-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      margin-top: 10px;
      font-size: 13px;
      color: #f87171;
      min-height: 18px;
    }

    /* Result box */
    .result-box {
      display: none;
      margin-top: 28px;
      padding: 18px 20px;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(124, 58, 237, 0.4);
      border-radius: 14px;
      align-items: center;
      gap: 14px;
    }

    .result-box.visible { display: flex; }

    .result-url {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      word-break: break-all;
    }

    .result-url a {
      color: #a78bfa;
      text-decoration: none;
    }

    .result-url a:hover { text-decoration: underline; }

    .copy-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(167, 139, 250, 0.5);
      background: transparent;
      color: #a78bfa;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .copy-btn:hover { background: rgba(167, 139, 250, 0.12); }
    .copy-btn.copied { color: #4ade80; border-color: #4ade80; }

    /* History */
    .history-section { margin-top: 36px; }

    .history-section h2 {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 14px;
    }

    #history-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      font-size: 14px;
    }

    .history-item .short {
      font-weight: 600;
      white-space: nowrap;
    }

    .history-item .short a { color: #a78bfa; text-decoration: none; }
    .history-item .short a:hover { text-decoration: underline; }

    .history-item .arrow { color: rgba(255,255,255,0.3); }

    .history-item .original {
      flex: 1;
      color: rgba(255,255,255,0.55);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      color: rgba(255,255,255,0.3);
      font-size: 14px;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🔗</div>
      <h1>URL Shortener</h1>
    </div>
    <p class="subtitle">Paste a long URL and get a short, shareable link instantly.</p>

    <div class="input-group">
      <input
        type="url"
        id="url-input"
        placeholder="https://example.com/very/long/url"
        aria-label="Long URL to shorten"
      />
      <button class="shorten-btn" id="shorten-btn">Shorten</button>
    </div>
    <p class="error-msg" id="error-msg"></p>

    <div class="result-box" id="result-box">
      <div class="result-url">
        <div style="font-size:12px; color:rgba(255,255,255,0.4); margin-bottom:4px;">Your short link</div>
        <a id="result-link" href="#"></a>
      </div>
      <button class="copy-btn" id="copy-btn">Copy</button>
    </div>

    <div class="history-section">
      <h2>Recent Links</h2>
      <ul id="history-list">
        <li class="empty-state" id="empty-state">No links shortened yet.</li>
      </ul>
    </div>
  </div>

  <script>
    const input = document.getElementById('url-input');
    const btn = document.getElementById('shorten-btn');
    const errorMsg = document.getElementById('error-msg');
    const resultBox = document.getElementById('result-box');
    const resultLink = document.getElementById('result-link');
    const copyBtn = document.getElementById('copy-btn');
    const historyList = document.getElementById('history-list');
    const emptyState = document.getElementById('empty-state');

    async function shorten() {
      const url = input.value.trim();
      errorMsg.textContent = '';
      resultBox.classList.remove('visible');

      if (!url) {
        errorMsg.textContent = 'Please enter a URL.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Shortening…';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Something went wrong.';
          return;
        }

        resultLink.href = data.shortUrl;
        resultLink.textContent = data.shortUrl;
        resultBox.classList.add('visible');
        input.value = '';

        loadHistory();
      } catch {
        errorMsg.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten';
      }
    }

    btn.addEventListener('click', shorten);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') shorten(); });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(resultLink.href).then(() => {
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 2000);
      });
    });

    async function loadHistory() {
      try {
        const res = await fetch('/api/urls');
        const list = await res.json();

        if (list.length === 0) {
          emptyState.style.display = '';
          return;
        }

        emptyState.style.display = 'none';
        historyList.innerHTML = list
          .slice(-10)
          .reverse()
          .map(
            ({ shortUrl, originalUrl }) => `
              <li class="history-item">
                <span class="short"><a href="${shortUrl}">${shortUrl}</a></span>
                <span class="arrow">→</span>
                <span class="original" title="${originalUrl}">${originalUrl}</span>
              </li>`
          )
          .join('');
      } catch {
        // silently ignore
      }
    }

    loadHistory();
  </script>
</body>
</html>
