<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="url"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s;
    }

    input[type="url"]:focus { border-color: #667eea; }

    button {
      padding: 0.75rem 1.4rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
      white-space: nowrap;
    }

    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #error-msg {
      color: #e53e3e;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      min-height: 1.2em;
    }

    .result-box {
      display: none;
      margin-top: 1.25rem;
      background: #f0f4ff;
      border: 1.5px solid #c0ccff;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      align-items: center;
      gap: 0.75rem;
    }

    .result-box.show { display: flex; }

    .result-box a {
      flex: 1;
      color: #5a67d8;
      font-weight: 600;
      text-decoration: none;
      word-break: break-all;
      font-size: 0.95rem;
    }

    .result-box a:hover { text-decoration: underline; }

    .copy-btn {
      padding: 0.45rem 0.9rem;
      font-size: 0.82rem;
      background: #5a67d8;
      border-radius: 7px;
    }

    .history {
      margin-top: 2rem;
    }

    .history h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.4rem;
    }

    #url-list { list-style: none; }

    #url-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid #f3f3f3;
      font-size: 0.88rem;
      gap: 0.5rem;
    }

    #url-list li:last-child { border-bottom: none; }

    .orig { color: #888; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #url-list a {
      color: #5a67d8;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    #url-list a:hover { text-decoration: underline; }

    .empty-state {
      text-align: center;
      color: #aaa;
      font-size: 0.85rem;
      padding: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Paste a long URL and get a short link instantly</p>

    <div class="input-row">
      <input type="url" id="url-input" placeholder="https://example.com/very/long/url" />
      <button id="shorten-btn">Shorten</button>
    </div>
    <p id="error-msg"></p>

    <div class="result-box" id="result-box">
      <a id="short-link" href="#" target="_blank" rel="noopener noreferrer"></a>
      <button class="copy-btn" id="copy-btn">Copy</button>
    </div>

    <div class="history">
      <h2>Recent links</h2>
      <ul id="url-list"><li class="empty-state">No links yet</li></ul>
    </div>
  </div>

  <script>
    const input    = document.getElementById('url-input');
    const btn      = document.getElementById('shorten-btn');
    const errMsg   = document.getElementById('error-msg');
    const resultBox = document.getElementById('result-box');
    const shortLink = document.getElementById('short-link');
    const copyBtn  = document.getElementById('copy-btn');
    const urlList  = document.getElementById('url-list');

    async function shorten() {
      const url = input.value.trim();
      errMsg.textContent = '';
      if (!url) { errMsg.textContent = 'Please enter a URL.'; return; }

      btn.disabled = true;
      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!res.ok) { errMsg.textContent = data.error || 'Something went wrong.'; return; }

        shortLink.href = data.shortUrl;
        shortLink.textContent = data.shortUrl;
        resultBox.classList.add('show');
        loadHistory();
      } catch {
        errMsg.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false;
      }
    }

    async function loadHistory() {
      const res = await fetch('/api/urls');
      const urls = await res.json();
      if (!urls.length) { urlList.innerHTML = '<li class="empty-state">No links yet</li>'; return; }
      urlList.innerHTML = urls
        .slice().reverse()
        .map(u => `
          <li>
            <span class="orig" title="${u.originalUrl}">${u.originalUrl}</span>
            <a href="${u.shortUrl}" target="_blank" rel="noopener noreferrer">${u.shortCode}</a>
          </li>`)
        .join('');
    }

    btn.addEventListener('click', shorten);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') shorten(); });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortLink.href).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
      });
    });

    loadHistory();
  </script>
</body>
</html>
