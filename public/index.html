<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #6c63ff;
      --accent-hover: #574fd6;
      --accent-light: rgba(108, 99, 255, 0.15);
      --text: #e8eaf6;
      --text-muted: #8b91b5;
      --success: #4caf72;
      --error: #ef5350;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      width: 52px;
      height: 52px;
      background: var(--accent);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 26px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 640px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: var(--accent);
    }

    input[type="url"]::placeholder { color: var(--text-muted); }

    button {
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      transition: background 0.2s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      white-space: nowrap;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-copy {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      font-size: 0.8rem;
    }

    .btn-copy:hover { background: var(--border); }

    .result-box {
      display: none;
      margin-top: 20px;
      background: var(--accent-light);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 16px;
    }

    .result-box.show { display: block; }

    .result-label {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .result-link-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .short-link {
      flex: 1;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      word-break: break-all;
    }

    .short-link:hover { color: var(--accent); text-decoration: underline; }

    .error-msg {
      display: none;
      margin-top: 12px;
      color: var(--error);
      font-size: 0.85rem;
    }

    .error-msg.show { display: block; }

    /* History section */
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 640px;
      width: 100%;
      margin: 36px 0 14px;
    }

    .history-header h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .url-list {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .url-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 12px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .url-item-info { overflow: hidden; }

    .url-short {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent);
      text-decoration: none;
      display: block;
      margin-bottom: 4px;
    }

    .url-short:hover { text-decoration: underline; }

    .url-original {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .url-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .url-clicks {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .url-clicks strong { color: var(--text); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .copy-toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--success);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }

    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🔗</div>
    <h1>URL <span>Shortener</span></h1>
    <p class="subtitle">Paste a long URL and get a short, shareable link instantly.</p>
  </header>

  <div class="card">
    <form id="shorten-form">
      <div class="input-row">
        <input
          type="url"
          id="url-input"
          placeholder="https://example.com/very/long/url..."
          autocomplete="off"
          required
        />
        <button type="submit" class="btn-primary" id="shorten-btn">Shorten</button>
      </div>
      <p class="error-msg" id="error-msg"></p>
    </form>

    <div class="result-box" id="result-box">
      <div class="result-label">Your short link</div>
      <div class="result-link-row">
        <a class="short-link" id="short-link" href="#" target="_blank"></a>
        <button class="btn-copy" id="copy-btn">Copy</button>
      </div>
    </div>
  </div>

  <div class="history-header">
    <h2>Recent Links</h2>
    <span class="badge" id="url-count">0 links</span>
  </div>

  <div class="url-list" id="url-list">
    <div class="empty-state">No links yet. Shorten your first URL above!</div>
  </div>

  <div class="copy-toast" id="copy-toast">Copied to clipboard!</div>

  <script>
    const form = document.getElementById('shorten-form');
    const urlInput = document.getElementById('url-input');
    const shortenBtn = document.getElementById('shorten-btn');
    const resultBox = document.getElementById('result-box');
    const shortLink = document.getElementById('short-link');
    const copyBtn = document.getElementById('copy-btn');
    const errorMsg = document.getElementById('error-msg');
    const urlList = document.getElementById('url-list');
    const urlCount = document.getElementById('url-count');
    const copyToast = document.getElementById('copy-toast');

    let toastTimer;

    function showToast(message = 'Copied to clipboard!') {
      copyToast.textContent = message;
      copyToast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => copyToast.classList.remove('show'), 2000);
    }

    function setError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
      resultBox.classList.remove('show');
    }

    function clearError() {
      errorMsg.classList.remove('show');
    }

    async function loadUrls() {
      try {
        const res = await fetch('/api/urls');
        const urls = await res.json();

        urlCount.textContent = `${urls.length} link${urls.length !== 1 ? 's' : ''}`;

        if (urls.length === 0) {
          urlList.innerHTML = '<div class="empty-state">No links yet. Shorten your first URL above!</div>';
          return;
        }

        urlList.innerHTML = urls.map(u => `
          <div class="url-item">
            <div class="url-item-info">
              <a class="url-short" href="${u.shortUrl}" target="_blank">${u.shortUrl}</a>
              <div class="url-original" title="${escapeHtml(u.originalUrl)}">${escapeHtml(u.originalUrl)}</div>
            </div>
            <div class="url-meta">
              <span class="url-clicks"><strong>${u.clicks}</strong> click${u.clicks !== 1 ? 's' : ''}</span>
              <button class="btn-copy" onclick="copyToClipboard('${escapeHtml(u.shortUrl)}')">Copy</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load URLs:', err);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast('Copied to clipboard!');
      } catch {
        showToast('Copy failed — try manually.');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const url = urlInput.value.trim();
      if (!url) return;

      shortenBtn.disabled = true;
      shortenBtn.textContent = 'Shortening…';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          setError(data.error || 'Something went wrong.');
          return;
        }

        shortLink.textContent = data.shortUrl;
        shortLink.href = data.shortUrl;
        resultBox.classList.add('show');
        urlInput.value = '';
        loadUrls();
      } catch {
        setError('Network error. Please try again.');
      } finally {
        shortenBtn.disabled = false;
        shortenBtn.textContent = 'Shorten';
      }
    });

    copyBtn.addEventListener('click', () => {
      copyToClipboard(shortLink.textContent);
    });

    // Initial load
    loadUrls();
  </script>

</body>
</html>
