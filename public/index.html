<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapLink — URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo svg { width: 36px; height: 36px; }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #a78bfa;
      margin-bottom: 8px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      padding: 14px 18px;
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      background: rgba(255,255,255,0.07);
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }

    input[type="url"]::placeholder { color: #64748b; }
    input[type="url"]:focus { border-color: #a78bfa; }

    button#shortenBtn {
      padding: 14px 22px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      white-space: nowrap;
    }

    button#shortenBtn:hover { opacity: .88; }
    button#shortenBtn:active { transform: scale(.97); }
    button#shortenBtn:disabled { opacity: .5; cursor: not-allowed; }

    .error {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #f87171;
      min-height: 20px;
    }

    /* Result box */
    .result-box {
      margin-top: 28px;
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 14px;
      padding: 20px 22px;
      display: none;
      animation: fadeIn .3s ease;
    }

    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .result-box .result-label {
      font-size: 0.75rem;
      color: #a78bfa;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result-link-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #shortLinkAnchor {
      flex: 1;
      font-size: 1.05rem;
      font-weight: 600;
      color: #60a5fa;
      word-break: break-all;
      text-decoration: none;
      transition: color .15s;
    }

    #shortLinkAnchor:hover { color: #93c5fd; text-decoration: underline; }

    .copy-btn {
      padding: 8px 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.2); }
    .copy-btn.copied { background: rgba(74,222,128,0.2); color: #4ade80; border-color: #4ade80; }

    .original-url {
      margin-top: 10px;
      font-size: 0.78rem;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* History */
    .history {
      margin-top: 36px;
    }

    .history h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .history-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      animation: fadeIn .25s ease;
    }

    .history-item a { color: #60a5fa; text-decoration: none; font-weight: 600; }
    .history-item a:hover { text-decoration: underline; }
    .history-item .hist-original { color: #64748b; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    footer {
      margin-top: 28px;
      font-size: 0.78rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 20 C12 14 18 9 24 12 L30 15" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
        <path d="M28 20 C28 26 22 31 16 28 L10 25" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
        <circle cx="30" cy="13" r="4" fill="#a78bfa"/>
        <circle cx="10" cy="27" r="4" fill="#60a5fa"/>
      </svg>
      <h1>SnapLink</h1>
    </div>
    <p class="subtitle">Shorten any URL instantly. Click the link to redirect.</p>

    <label for="urlInput">Paste your long URL</label>
    <div class="input-row">
      <input
        type="url"
        id="urlInput"
        placeholder="https://example.com/very/long/path?query=value"
        autocomplete="off"
      />
      <button id="shortenBtn">Shorten</button>
    </div>
    <p class="error" id="errorMsg"></p>

    <div class="result-box" id="resultBox">
      <div class="result-label">Your Short Link</div>
      <div class="result-link-row">
        <a id="shortLinkAnchor" href="#" target="_blank" rel="noopener noreferrer"></a>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <div class="original-url" id="originalUrlDisplay"></div>
    </div>

    <div class="history" id="historySection" style="display:none;">
      <h2>Recent Links</h2>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <footer>SnapLink &copy; 2024 — Fast, clean URL shortening</footer>

  <script>
    const urlInput    = document.getElementById('urlInput');
    const shortenBtn  = document.getElementById('shortenBtn');
    const errorMsg    = document.getElementById('errorMsg');
    const resultBox   = document.getElementById('resultBox');
    const shortLink   = document.getElementById('shortLinkAnchor');
    const copyBtn     = document.getElementById('copyBtn');
    const originalUrlDisplay = document.getElementById('originalUrlDisplay');
    const historySection = document.getElementById('historySection');
    const historyList    = document.getElementById('historyList');

    const history = [];

    async function shorten() {
      const url = urlInput.value.trim();
      errorMsg.textContent = '';

      if (!url) {
        errorMsg.textContent = 'Please enter a URL.';
        return;
      }

      try { new URL(url); }
      catch { errorMsg.textContent = 'Please enter a valid URL (include https://).'; return; }

      shortenBtn.disabled = true;
      shortenBtn.textContent = 'Shortening…';

      try {
        const res = await fetch('/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Something went wrong.';
          return;
        }

        // Show result
        shortLink.href = data.shortUrl;
        shortLink.textContent = data.shortUrl;
        originalUrlDisplay.textContent = '↳ ' + url;
        resultBox.style.display = 'block';
        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('copied');

        // Add to history
        history.unshift({ shortUrl: data.shortUrl, originalUrl: url });
        renderHistory();

        urlInput.value = '';
      } catch (err) {
        errorMsg.textContent = 'Network error. Please try again.';
      } finally {
        shortenBtn.disabled = false;
        shortenBtn.textContent = 'Shorten';
      }
    }

    function renderHistory() {
      if (history.length === 0) { historySection.style.display = 'none'; return; }
      historySection.style.display = 'block';
      historyList.innerHTML = '';
      history.slice(0, 5).forEach(({ shortUrl, originalUrl }) => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <a href="${shortUrl}" target="_blank" rel="noopener noreferrer">${shortUrl}</a>
          <span class="hist-original" title="${originalUrl}">${originalUrl}</span>
        `;
        historyList.appendChild(li);
      });
    }

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortLink.href).then(() => {
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 2000);
      });
    });

    shortenBtn.addEventListener('click', shorten);
    urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') shorten(); });
  </script>
</body>
</html>
