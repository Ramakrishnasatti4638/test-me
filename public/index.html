<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
      font-weight: 700;
    }

    .header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .input-group button {
      padding: 12px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .input-group button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .input-group button:active {
      transform: translateY(0);
    }

    .todos-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    .todo-item:hover {
      background: #f0f0f0;
      transform: translateX(5px);
    }

    .todo-item.completed {
      opacity: 0.6;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #999;
    }

    .todo-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: #333;
      word-break: break-word;
    }

    .todo-delete {
      padding: 6px 12px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .todo-delete:hover {
      background: #ff5252;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state svg {
      width: 60px;
      height: 60px;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 1rem;
    }

    .stats {
      display: flex;
      gap: 20px;
      padding: 15px 20px;
      background: #f5f5f5;
      border-top: 1px solid #e0e0e0;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }

    .stat {
      flex: 1;
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: #667eea;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #999;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 2rem;
      }

      .input-group {
        flex-direction: column;
      }

      .input-group button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✓ Todo</h1>
      <p>Stay organized and productive</p>
    </div>

    <div class="content">
      <div class="input-group">
        <input 
          type="text" 
          id="todoInput" 
          placeholder="Add a new task..."
          aria-label="Add a new task"
        >
        <button id="addBtn" aria-label="Add todo">Add</button>
      </div>

      <div id="loading" class="loading" style="display: none;">Loading todos...</div>

      <ul id="todosList" class="todos-list"></ul>

      <div id="emptyState" class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <p>No todos yet. Add one to get started!</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="totalCount">0</div>
        <div>Total</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="completedCount">0</div>
        <div>Completed</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="remainingCount">0</div>
        <div>Remaining</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api/todos';
    const todoInput = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const todosList = document.getElementById('todosList');
    const emptyState = document.getElementById('emptyState');
    const loading = document.getElementById('loading');
    const totalCount = document.getElementById('totalCount');
    const completedCount = document.getElementById('completedCount');
    const remainingCount = document.getElementById('remainingCount');

    let todos = [];

    // Fetch todos from server
    async function fetchTodos() {
      try {
        loading.style.display = 'block';
        todosList.innerHTML = '';
        const response = await fetch(API_URL);
        todos = await response.json();
        renderTodos();
      } catch (error) {
        console.error('Error fetching todos:', error);
        emptyState.innerHTML = '<p>Error loading todos. Please refresh.</p>';
      } finally {
        loading.style.display = 'none';
      }
    }

    // Render todos to DOM
    function renderTodos() {
      todosList.innerHTML = '';
      
      if (todos.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        todos.forEach(todo => {
          const li = document.createElement('li');
          li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
          li.innerHTML = `
            <input 
              type="checkbox" 
              class="todo-checkbox" 
              ${todo.completed ? 'checked' : ''}
              onchange="toggleTodo(${todo.id})"
              aria-label="Complete todo: ${todo.text}"
            >
            <span class="todo-text">${escapeHtml(todo.text)}</span>
            <button class="todo-delete" onclick="deleteTodo(${todo.id})" aria-label="Delete todo">Delete</button>
          `;
          todosList.appendChild(li);
        });
      }
      
      updateStats();
    }

    // Add a new todo
    async function addTodo() {
      const text = todoInput.value.trim();
      if (!text) return;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        
        if (response.ok) {
          const todo = await response.json();
          todos.push(todo);
          todoInput.value = '';
          renderTodos();
        }
      } catch (error) {
        console.error('Error adding todo:', error);
        alert('Failed to add todo');
      }
    }

    // Toggle todo completion
    async function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (!todo) return;

      try {
        const response = await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed: !todo.completed })
        });

        if (response.ok) {
          todo.completed = !todo.completed;
          renderTodos();
        }
      } catch (error) {
        console.error('Error toggling todo:', error);
      }
    }

    // Delete a todo
    async function deleteTodo(id) {
      if (!confirm('Delete this todo?')) return;

      try {
        const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        if (response.ok) {
          todos = todos.filter(t => t.id !== id);
          renderTodos();
        }
      } catch (error) {
        console.error('Error deleting todo:', error);
      }
    }

    // Update stats
    function updateStats() {
      const total = todos.length;
      const completed = todos.filter(t => t.completed).length;
      const remaining = total - completed;

      totalCount.textContent = total;
      completedCount.textContent = completed;
      remainingCount.textContent = remaining;
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event listeners
    addBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    // Initial load
    fetchTodos();
  </script>
</body>
</html>
