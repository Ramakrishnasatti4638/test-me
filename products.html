<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Product Listing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="products.html">🛍️ Shop</a>
      <button id="cart-toggle" class="cart-toggle" aria-label="Open cart">
        <span class="cart-icon">🛒</span>
        <span id="cart-count" class="cart-count">0</span>
      </button>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1>Featured Products</h1>
      <p>Pick something you love. Add it to your cart and check out.</p>
    </section>

    <section id="product-grid" class="product-grid" aria-live="polite">
      <!-- Product cards rendered by app.js -->
    </section>
  </main>

  <!-- Backdrop -->
  <div id="cart-backdrop" class="cart-backdrop" hidden></div>

  <!-- Cart Sidebar -->
  <aside id="cart-sidebar" class="cart-sidebar" aria-hidden="true" aria-label="Shopping cart">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="cart-close" class="cart-close" aria-label="Close cart">×</button>
    </div>

    <div id="cart-items" class="cart-items">
      <!-- Cart items rendered by app.js -->
    </div>

    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button id="checkout-btn" class="checkout-btn">Checkout</button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
