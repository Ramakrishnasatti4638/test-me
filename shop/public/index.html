<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Product Listing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">🛍️ Mini Shop</h1>
      <button id="open-cart" class="cart-toggle" aria-label="Open cart">
        <span class="cart-icon">🛒</span>
        <span id="cart-count" class="cart-count">0</span>
      </button>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title">Our Products</h2>
    <div id="products" class="product-grid" aria-live="polite"></div>
  </main>

  <!-- Backdrop -->
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>

  <!-- Cart sidebar -->
  <aside id="cart-sidebar" class="cart-sidebar" aria-hidden="true" aria-label="Shopping cart">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="close-cart" class="close-btn" aria-label="Close cart">×</button>
    </div>

    <div id="cart-items" class="cart-items">
      <!-- Cart rows injected here -->
    </div>

    <div id="cart-empty" class="cart-empty">
      <p>Your cart is empty.</p>
      <p class="muted">Add something from the product list!</p>
    </div>

    <div class="cart-footer">
      <div class="total-row">
        <span>Total</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button id="clear-cart" class="clear-btn">Clear Cart</button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
