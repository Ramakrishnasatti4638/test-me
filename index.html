<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #0f172a;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --primary-soft: #eef2ff;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
        --success: #16a34a;
        --focus: 0 0 0 3px rgba(79, 70, 229, 0.25);
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: 16px;
        padding: 40px 32px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
      }

      .brand {
        text-align: center;
        margin-bottom: 28px;
      }

      .brand-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, #4f46e5, #ec4899);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 700;
        font-size: 20px;
        margin-bottom: 12px;
      }

      .brand h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
      }

      .brand p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-size: 13px;
        font-weight: 600;
        color: #334155;
      }

      .input-wrap {
        position: relative;
      }

      input[type="text"],
      input[type="password"],
      input[type="email"] {
        width: 100%;
        padding: 12px 14px;
        font-size: 15px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        transition: border-color 0.15s, box-shadow 0.15s;
        outline: none;
      }

      input::placeholder {
        color: #94a3b8;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: var(--focus);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #475569;
        cursor: pointer;
        user-select: none;
      }

      .remember input {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
        cursor: pointer;
      }

      .link {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
      }

      .link:hover {
        text-decoration: underline;
      }

      button[type="submit"] {
        margin-top: 8px;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--primary);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.15s, transform 0.05s;
      }

      button[type="submit"]:hover:not(:disabled) {
        background: var(--primary-hover);
      }

      button[type="submit"]:active:not(:disabled) {
        transform: translateY(1px);
      }

      button[type="submit"]:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .message {
        display: none;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.4;
      }

      .message.error {
        display: block;
        background: var(--danger-soft);
        color: var(--danger);
        border: 1px solid #fecaca;
      }

      .message.success {
        display: block;
        background: #f0fdf4;
        color: var(--success);
        border: 1px solid #bbf7d0;
      }

      .footer {
        margin-top: 24px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        margin-right: 8px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: -2px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">L</div>
        <h1>Welcome back</h1>
        <p>Sign in to your account to continue</p>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />
          </div>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember" />
            Remember me
          </label>
          <a class="link" href="#" onclick="return false;">Forgot password?</a>
        </div>

        <button type="submit" id="submit-btn">Sign in</button>
      </form>

      <p class="footer">
        Don't have an account?
        <a class="link" href="#" onclick="return false;">Sign up</a>
      </p>
    </main>

    <script>
      (function () {
        const form = document.getElementById("login-form");
        const message = document.getElementById("message");
        const submitBtn = document.getElementById("submit-btn");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        function showMessage(text, type) {
          message.textContent = text;
          message.className = "message " + type;
        }

        function clearMessage() {
          message.textContent = "";
          message.className = "message";
        }

        function setLoading(loading) {
          if (loading) {
            submitBtn.disabled = true;
            submitBtn.innerHTML =
              '<span class="spinner" aria-hidden="true"></span>Signing in…';
          } else {
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign in";
          }
        }

        function isValidEmail(value) {
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          clearMessage();

          const email = emailInput.value.trim();
          const password = passwordInput.value;

          if (!email) {
            showMessage("Please enter your email.", "error");
            emailInput.focus();
            return;
          }
          if (!isValidEmail(email)) {
            showMessage("Please enter a valid email address.", "error");
            emailInput.focus();
            return;
          }
          if (!password) {
            showMessage("Please enter your password.", "error");
            passwordInput.focus();
            return;
          }
          if (password.length < 6) {
            showMessage("Password must be at least 6 characters.", "error");
            passwordInput.focus();
            return;
          }

          setLoading(true);

          // Simulated sign-in. Replace with a real API call when ready.
          setTimeout(function () {
            setLoading(false);
            showMessage("Signed in as " + email + ".", "success");
            // form.reset(); // uncomment to clear on success
          }, 900);
        });

        // Clear message as the user starts editing again
        [emailInput, passwordInput].forEach(function (el) {
          el.addEventListener("input", clearMessage);
        });
      })();
    </script>
  </body>
</html>
