<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Todo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Todos</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        id="todo-input"
        type="text"
        placeholder="What needs to be done?"
        aria-label="New todo"
        maxlength="200"
        required
      />
      <button type="submit">Add</button>
    </form>

    <div class="filters" role="tablist" aria-label="Filter todos">
      <button class="filter active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="filter" data-filter="active" role="tab" aria-selected="false">Active</button>
      <button class="filter" data-filter="completed" role="tab" aria-selected="false">Completed</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <p id="empty-state" class="empty-state" hidden>No todos here yet.</p>

    <footer class="footer">
      <span id="counter">0 items left</span>
      <button id="clear-completed" type="button">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
