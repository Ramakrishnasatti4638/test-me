<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 60px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 32px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #111827;
      outline: none;
      transition: border-color 0.2s;
      background: #ffffff;
    }

    .input-row input:focus {
      border-color: #6366f1;
    }

    .input-row input::placeholder {
      color: #9ca3af;
    }

    .input-row button {
      padding: 12px 20px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.25rem;
      cursor: pointer;
      transition: background 0.2s;
      line-height: 1;
    }

    .input-row button:hover {
      background: #4f46e5;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filters button {
      padding: 6px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 20px;
      background: #fff;
      font-size: 0.8rem;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filters button.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1.5px solid #f3f4f6;
      border-radius: 12px;
      background: #fafafa;
      transition: border-color 0.2s, opacity 0.2s;
    }

    .todo-item:hover {
      border-color: #d1d5db;
    }

    .todo-item.done {
      opacity: 0.55;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-item .text {
      flex: 1;
      font-size: 0.95rem;
      color: #111827;
      word-break: break-word;
    }

    .todo-item.done .text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .todo-item .delete-btn {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .todo-item .delete-btn:hover {
      color: #ef4444;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      font-size: 0.9rem;
      padding: 40px 0;
    }

    .footer {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .footer button {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .footer button:hover {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Tasks</h1>
    <p class="subtitle">Stay organised, get things done.</p>

    <div class="input-row">
      <input id="todo-input" type="text" placeholder="Add a new task…" maxlength="200" />
      <button id="add-btn" title="Add task">+</button>
    </div>

    <div class="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>

    <div class="footer">
      <span id="count-label"></span>
      <button id="clear-done">Clear completed</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('todo-list');
    const countLabel = document.getElementById('count-label');
    const clearDoneBtn = document.getElementById('clear-done');
    const filterBtns = document.querySelectorAll('.filters button');

    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let filter = 'all';

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function getFiltered() {
      if (filter === 'active') return todos.filter(t => !t.done);
      if (filter === 'done') return todos.filter(t => t.done);
      return todos;
    }

    function render() {
      const filtered = getFiltered();
      list.innerHTML = '';

      if (filtered.length === 0) {
        list.innerHTML = '<li class="empty">No tasks here!</li>';
      } else {
        filtered.forEach(todo => {
          const li = document.createElement('li');
          li.className = 'todo-item' + (todo.done ? ' done' : '');

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = todo.done;
          cb.addEventListener('change', () => toggle(todo.id));

          const span = document.createElement('span');
          span.className = 'text';
          span.textContent = todo.text;

          const del = document.createElement('button');
          del.className = 'delete-btn';
          del.textContent = '✕';
          del.title = 'Delete';
          del.addEventListener('click', () => remove(todo.id));

          li.append(cb, span, del);
          list.appendChild(li);
        });
      }

      const remaining = todos.filter(t => !t.done).length;
      countLabel.textContent = `${remaining} task${remaining !== 1 ? 's' : ''} left`;
      clearDoneBtn.style.visibility = todos.some(t => t.done) ? 'visible' : 'hidden';
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggle(id) {
      todos = todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
      save();
      render();
    }

    function remove(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', e => e.key === 'Enter' && addTodo());

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });

    clearDoneBtn.addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
