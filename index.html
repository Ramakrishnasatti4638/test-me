<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 2rem 1rem;
      color: #1d1d1f;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    h1 { margin: 0 0 1rem; font-size: 1.5rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: #0071e3; }
    button {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 8px;
      background: #0071e3;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #005bb5; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.25rem;
      border-bottom: 1px solid #f0f0f0;
    }
    li:last-child { border-bottom: none; }
    li.done span { text-decoration: line-through; color: #8e8e93; }
    li span { flex: 1; cursor: pointer; }
    .delete {
      background: transparent;
      color: #ff3b30;
      padding: 0.25rem 0.5rem;
      font-size: 0.9rem;
    }
    .delete:hover { background: #ffebea; }
    .empty {
      text-align: center;
      color: #8e8e93;
      padding: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todo</h1>
    <form id="form">
      <input type="text" id="input" placeholder="What needs to be done?" autofocus />
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden>No todos yet.</p>
  </div>

  <script>
    const STORAGE_KEY = "todos";
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");

    let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = "";
      empty.hidden = todos.length > 0;
      todos.forEach((todo, i) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const span = document.createElement("span");
        span.textContent = todo.text;
        span.addEventListener("click", () => {
          todos[i].done = !todos[i].done;
          save();
          render();
        });

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "Delete";
        del.addEventListener("click", () => {
          todos.splice(i, 1);
          save();
          render();
        });

        li.append(span, del);
        list.appendChild(li);
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = "";
      save();
      render();
    });

    render();
  </script>
</body>
</html>
