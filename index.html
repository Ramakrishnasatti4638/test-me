<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Todos</h1>
      <p class="subtitle">Keep it simple. Get things done.</p>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        id="todo-input"
        type="text"
        placeholder="What needs to be done?"
        aria-label="New todo"
        maxlength="200"
        required
      />
      <button type="submit" id="add-btn">Add</button>
    </form>

    <section class="todo-section" aria-live="polite">
      <ul id="todo-list" class="todo-list" aria-label="Todo items"></ul>
      <p id="empty-state" class="empty-state">No todos yet. Add your first one above.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
