<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo App</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #e5e5ea;
    --accent: #0071e3;
    --accent-hover: #005bb5;
    --danger: #ff3b30;
    --done: #a1a1a6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .app {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    padding: 28px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 24px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 20px;
  }

  form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus { border-color: var(--accent); }

  button {
    font-size: 14px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    padding: 12px 16px;
    font-weight: 500;
    transition: background 0.15s, opacity 0.15s;
  }

  button.primary {
    background: var(--accent);
    color: white;
  }
  button.primary:hover { background: var(--accent-hover); }

  button.ghost {
    background: transparent;
    color: var(--muted);
    padding: 6px 8px;
  }
  button.ghost:hover { color: var(--danger); }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }

  li:last-child { border-bottom: none; }

  .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }

  .checkbox.done {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-size: 14px;
    line-height: 1;
  }

  .text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }

  .text.done {
    color: var(--done);
    text-decoration: line-through;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 24px 0;
    font-size: 14px;
  }

  .clear-btn {
    background: transparent;
    color: var(--accent);
    padding: 4px 0;
    font-size: 13px;
  }
  .clear-btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
  <main class="app">
    <h1>Todo</h1>
    <div class="subtitle">A simple list. Saved in your browser.</div>

    <form id="form">
      <input id="input" type="text" placeholder="What needs doing?" autocomplete="off" />
      <button class="primary" type="submit">Add</button>
    </form>

    <div class="toolbar">
      <span id="counter">0 items</span>
      <button id="clearBtn" class="clear-btn" type="button">Clear completed</button>
    </div>

    <ul id="list"></ul>
    <div id="empty" class="empty">Nothing here yet. Add your first task above.</div>
  </main>

<script>
  const STORAGE_KEY = "todos";
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const list = document.getElementById("list");
  const counter = document.getElementById("counter");
  const clearBtn = document.getElementById("clearBtn");
  const emptyEl = document.getElementById("empty");

  let todos = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function add(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    todos.push({ id: Date.now(), text: trimmed, done: false });
    save();
    render();
  }

  function toggle(id) {
    const t = todos.find(t => t.id === id);
    if (t) t.done = !t.done;
    save();
    render();
  }

  function remove(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(t => !t.done);
    save();
    render();
  }

  function render() {
    list.innerHTML = "";
    const remaining = todos.filter(t => !t.done).length;
    const completed = todos.length - remaining;
    counter.textContent = `${remaining} ${remaining === 1 ? "item" : "items"}`;
    clearBtn.disabled = completed === 0;
    emptyEl.style.display = todos.length === 0 ? "block" : "none";

    for (const t of todos) {
      const li = document.createElement("li");

      const cb = document.createElement("span");
      cb.className = "checkbox" + (t.done ? " done" : "");
      cb.textContent = t.done ? "✓" : "";
      cb.setAttribute("role", "checkbox");
      cb.setAttribute("aria-checked", String(t.done));
      cb.tabIndex = 0;
      cb.addEventListener("click", () => toggle(t.id));
      cb.addEventListener("keydown", e => {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(t.id); }
      });

      const span = document.createElement("span");
      span.className = "text" + (t.done ? " done" : "");
      span.textContent = t.text;

      const del = document.createElement("button");
      del.className = "ghost";
      del.type = "button";
      del.setAttribute("aria-label", "Delete task");
      del.textContent = "Delete";
      del.addEventListener("click", () => remove(t.id));

      li.append(cb, span, del);
      list.appendChild(li);
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    add(input.value);
    input.value = "";
    input.focus();
  });

  clearBtn.addEventListener("click", clearCompleted);

  render();
</script>
</body>
</html>
