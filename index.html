<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      padding: 2rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .login-card h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      color: #111;
      text-align: center;
    }

    .login-card p {
      margin: 0 0 1.5rem;
      color: #666;
      text-align: center;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .error {
      color: #d32f2f;
      font-size: 0.85rem;
      margin-top: 0.25rem;
      display: none;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      margin-top: 0.5rem;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #5568d3;
    }

    button:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Welcome back</h1>
    <p>Please sign in to continue</p>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
        <span class="error" id="emailError">Please enter a valid email.</span>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" />
        <span class="error" id="passwordError">Password must be at least 6 characters.</span>
      </div>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      let valid = true;

      if (!validateEmail(emailInput.value.trim())) {
        emailError.style.display = 'block';
        emailInput.style.borderColor = '#d32f2f';
        valid = false;
      } else {
        emailError.style.display = 'none';
        emailInput.style.borderColor = '#ccc';
      }

      if (passwordInput.value.length < 6) {
        passwordError.style.display = 'block';
        passwordInput.style.borderColor = '#d32f2f';
        valid = false;
      } else {
        passwordError.style.display = 'none';
        passwordInput.style.borderColor = '#ccc';
      }

      if (valid) {
        alert('Logged in successfully!');
        form.reset();
      }
    });
  </script>
</body>
</html>
