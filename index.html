<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 60px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
      color: #111;
    }

    .input-row input:focus {
      border-color: #6366f1;
    }

    .input-row button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: #4f46e5;
    }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .filters button {
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 2px solid #e5e7eb;
      border-radius: 20px;
      background: #fff;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filters button.active {
      border-color: #6366f1;
      color: #6366f1;
      background: #eef2ff;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      transition: border-color 0.15s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item:hover { border-color: #c7d2fe; }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-item .text {
      flex: 1;
      font-size: 1rem;
      color: #222;
      word-break: break-word;
    }

    .todo-item.done .text {
      text-decoration: line-through;
      color: #aaa;
    }

    .todo-item .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 1.2rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color 0.15s;
    }

    .todo-item .delete-btn:hover { color: #ef4444; }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 0.95rem;
      margin-top: 40px;
    }

    .footer {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #aaa;
    }

    .footer button {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .footer button:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Todos</h1>

    <div class="input-row">
      <input id="todoInput" type="text" placeholder="Add a new task…" />
      <button onclick="addTodo()">Add</button>
    </div>

    <div class="filters">
      <button class="active" data-filter="all"     onclick="setFilter('all')">All</button>
      <button              data-filter="active"   onclick="setFilter('active')">Active</button>
      <button              data-filter="completed" onclick="setFilter('completed')">Completed</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>

    <p class="empty" id="emptyMsg" style="display:none">No tasks here!</p>

    <div class="footer">
      <span id="countLabel"></span>
      <button onclick="clearCompleted()">Clear completed</button>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let filter = 'all';

    const input    = document.getElementById('todoInput');
    const list     = document.getElementById('todoList');
    const emptyMsg = document.getElementById('emptyMsg');
    const countLbl = document.getElementById('countLabel');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggleTodo(id) {
      const t = todos.find(t => t.id === id);
      if (t) { t.done = !t.done; save(); render(); }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    function clearCompleted() {
      todos = todos.filter(t => !t.done);
      save();
      render();
    }

    function setFilter(f) {
      filter = f;
      document.querySelectorAll('.filters button').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === f);
      });
      render();
    }

    function render() {
      const visible = todos.filter(t =>
        filter === 'all'       ? true :
        filter === 'active'    ? !t.done :
        /* completed */          t.done
      );

      list.innerHTML = '';
      visible.forEach(t => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (t.done ? ' done' : '');
        li.innerHTML = `
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${t.id})" />
          <span class="text">${escHtml(t.text)}</span>
          <button class="delete-btn" onclick="deleteTodo(${t.id})" title="Delete">✕</button>
        `;
        list.appendChild(li);
      });

      const active = todos.filter(t => !t.done).length;
      countLbl.textContent = `${active} task${active !== 1 ? 's' : ''} left`;
      emptyMsg.style.display = visible.length === 0 ? 'block' : 'none';
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    render();
  </script>
</body>
</html>
