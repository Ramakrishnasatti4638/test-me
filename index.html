<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Todos</h1>
      <p class="app__subtitle">Stay focused. Get things done.</p>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label for="todo-input" class="visually-hidden">Add a new task</label>
      <input
        id="todo-input"
        class="todo-form__input"
        type="text"
        name="todo"
        placeholder="What needs to be done?"
        maxlength="200"
        required
      />
      <button type="submit" class="todo-form__btn" aria-label="Add task">
        Add
      </button>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <button type="button" class="filters__btn is-active" data-filter="all">All</button>
      <button type="button" class="filters__btn" data-filter="active">Active</button>
      <button type="button" class="filters__btn" data-filter="completed">Completed</button>
    </nav>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="app__footer">
      <span id="items-left" class="items-left">0 items left</span>
      <button type="button" id="clear-completed" class="clear-btn">
        Clear completed
      </button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
