<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-icon">✓</div>
      <div>
        <h1>My Tasks</h1>
        <p class="subtitle" id="task-summary">Get things done, one task at a time.</p>
      </div>
    </header>

    <main class="todo-card">
      <form id="todo-form" class="todo-form">
        <div class="input-wrapper">
          <input
            type="text"
            id="todo-input"
            placeholder="Add a new task..."
            autocomplete="off"
            aria-label="New task description"
            required
          />
          <button type="submit" id="add-btn" aria-label="Add task">
            <span class="plus-icon">+</span>
            <span>Add</span>
          </button>
        </div>
      </form>

      <div class="controls-bar">
        <div class="filters" role="tablist" aria-label="Filter tasks">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="active">Active</button>
          <button type="button" class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button type="button" id="clear-completed" class="clear-btn">Clear Completed</button>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <p class="empty-title">No tasks found</p>
        <p class="empty-subtitle">Add a task to get started!</p>
      </div>

      <ul id="todo-list" class="todo-list" aria-label="Tasks list"></ul>

      <footer class="card-footer">
        <span id="items-left">0 items left</span>
        <span id="completion-stat">0% done</span>
      </footer>
    </main>
  </div>

  <script src="todo-store.js"></script>
  <script src="app.js"></script>
</body>
</html>
