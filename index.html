<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Todo App</h1>
            <p class="subtitle">Stay organized and get things done</p>
        </header>

        <div class="input-section">
            <input
                type="text"
                id="todo-input"
                placeholder="What needs to be done?"
                autocomplete="off"
            >
            <button id="add-btn" aria-label="Add todo">Add</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>

        <div class="footer">
            <span id="items-count">0 items left</span>
            <button id="clear-completed" class="clear-btn">Clear completed</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
