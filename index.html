<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="What needs to be done?"
        aria-label="New todo"
        maxlength="200"
      />
      <button type="submit" class="add-btn">Add</button>
    </form>

    <div class="filters" role="tablist" aria-label="Filter todos">
      <button class="filter-btn is-active" data-filter="all" role="tab">All</button>
      <button class="filter-btn" data-filter="active" role="tab">Active</button>
      <button class="filter-btn" data-filter="completed" role="tab">Completed</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <p id="empty-state" class="empty-state" hidden>Nothing here yet.</p>

    <footer class="app-footer">
      <span id="item-count" class="item-count">0 items left</span>
      <button id="clear-completed" class="clear-btn" type="button">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
