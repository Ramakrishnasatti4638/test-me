<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Todo App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        id="todo-input"
        type="text"
        placeholder="What needs to be done?"
        aria-label="New todo"
        required
      />
      <button type="submit" aria-label="Add todo">Add</button>
    </form>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <div class="todo-footer">
      <span id="count">0 items left</span>
      <button id="clear-completed" type="button">Clear completed</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
